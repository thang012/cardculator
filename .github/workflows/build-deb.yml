name: Build Cardculator 2.1.1

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15

    env:
      THEOS: ${{ github.workspace }}/theos
      THEOS_PACKAGE_SCHEME: rootless
      FINALPACKAGE: 1
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
      SDKROOT: /Applications/Xcode_16.4.app/Contents/Developer/Platforms/iPhoneOS.platform/Developer/SDKs/iPhoneOS18.5.sdk

    steps:

      # ============================================================
      # CHECKOUT
      # ============================================================

      - name: Checkout Cardculator
        uses: actions/checkout@v4

      # ============================================================
      # XCODE 16.4
      # ============================================================

      - name: Select Xcode 16.4
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "16.4"

      - name: Verify Xcode
        shell: bash
        run: |
          set -e

          export DEVELOPER_DIR="/Applications/Xcode_16.4.app/Contents/Developer"

          echo "=========================================="
          echo "                 XCODE"
          echo "=========================================="

          echo "DEVELOPER_DIR=$DEVELOPER_DIR"

          xcode-select -p
          xcodebuild -version

          echo
          echo "Available iPhoneOS SDKs:"
          xcodebuild -showsdks | grep -i iphoneos || true

          echo
          echo "clang:"
          xcrun --find clang
          xcrun clang --version

          echo
          echo "swift:"
          xcrun --find swift
          swift --version

          echo
          echo "SDKROOT:"
          xcrun --sdk iphoneos --show-sdk-path

      # ============================================================
      # CLEAN OLD XCODE ENVIRONMENT
      # ============================================================

      - name: Clean Xcode environment
        shell: bash
        run: |
          set -e

          export DEVELOPER_DIR="/Applications/Xcode_16.4.app/Contents/Developer"

          echo "=========================================="
          echo "          CLEAN XCODE ENVIRONMENT"
          echo "=========================================="

          unset SDKROOT || true
          unset TOOLCHAINS || true

          export DEVELOPER_DIR="/Applications/Xcode_16.4.app/Contents/Developer"

          echo "DEVELOPER_DIR=$DEVELOPER_DIR"

          xcrun --find clang
          xcrun --find swift

          echo
          echo "Developer directory:"
          xcode-select -p

          echo
          echo "clang path:"
          xcrun --find clang

          echo
          echo "swift path:"
          xcrun --find swift

      # ============================================================
      # THEOS
      # ============================================================

      - name: Install Theos
        shell: bash
        run: |
          set -e

          rm -rf "$THEOS"

          git clone \
            --recursive \
            https://github.com/theos/theos.git \
            "$THEOS"

          cd "$THEOS"

          git submodule update --init --recursive

          echo "=========================================="
          echo "                 THEOS"
          echo "=========================================="

          echo "THEOS=$THEOS"

          echo
          echo "Commit:"
          git rev-parse HEAD

      # ============================================================
      # LDID
      # ============================================================

      - name: Install ldid
        shell: bash
        run: |
          set -e

          brew install ldid

          echo "=========================================="
          echo "                  LDID"
          echo "=========================================="

          command -v ldid
          ldid -h 2>&1 | head -20 || true

      # ============================================================
      # SVN
      #
      # Theos requires svn for some dependencies.
      # ============================================================

      - name: Install SVN
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "                  SVN"
          echo "=========================================="

          if ! command -v svn >/dev/null 2>&1; then
            brew install svn
          fi

          command -v svn
          svn --version --quiet

      # ============================================================
      # iPhoneOS 16.4 SDK
      #
      # Download from GitHub release API.
      #
      # Do NOT assume a fixed asset filename.
      # ============================================================

      - name: Install iPhoneOS 16.4 SDK
        shell: bash
        run: |
          set -e

          SDK_DIR="$THEOS/sdks"
          WORK_DIR="$RUNNER_TEMP/ios16sdk"

          mkdir -p "$SDK_DIR"
          rm -rf "$WORK_DIR"

          mkdir -p "$WORK_DIR"

          echo "=========================================="
          echo "        iPhoneOS 16.4 SDK"
          echo "=========================================="

          API_URL="https://api.github.com/repos/xybp888/iOS-SDKs/releases"

          echo
          echo "Searching iOS SDK releases..."

          curl \
            --fail \
            --retry 5 \
            --retry-all-errors \
            -sSL \
            "$API_URL" \
            -o "$WORK_DIR/releases.json"

          SDK_URL=$(
            python3 - "$WORK_DIR/releases.json" <<'PY'
import json
import sys

path = sys.argv[1]

with open(path, "r", encoding="utf-8") as f:
    releases = json.load(f)

for release in releases:
    for asset in release.get("assets", []):
        name = asset.get("name", "")
        url = asset.get("browser_download_url", "")

        lower = name.lower()

        if (
            "iphoneos16.4.sdk" in lower
            and lower.endswith(".zip")
        ):
            print(url)
            sys.exit(0)

        if (
            "iphoneos16.4" in lower
            and lower.endswith(".zip")
        ):
            print(url)
            sys.exit(0)

print("ERROR: iPhoneOS 16.4 SDK asset not found.", file=sys.stderr)
sys.exit(1)
PY
          )

          echo
          echo "SDK URL:"
          echo "$SDK_URL"

          echo
          echo "Downloading..."

          curl \
            --fail \
            --retry 5 \
            --retry-all-errors \
            -L \
            "$SDK_URL" \
            -o "$WORK_DIR/sdk.zip"

          echo
          echo "Downloaded:"
          ls -lh "$WORK_DIR/sdk.zip"

          echo
          echo "Archive:"
          unzip -l "$WORK_DIR/sdk.zip" | head -50

          echo
          echo "Extracting..."

          unzip -q \
            "$WORK_DIR/sdk.zip" \
            -d "$WORK_DIR/extracted"

          SDK_SOURCE=$(
            find "$WORK_DIR/extracted" \
              -type d \
              -name "iPhoneOS16.4.sdk" \
              -print \
              -quit
          )

          if [ -z "$SDK_SOURCE" ]; then
            echo
            echo "ERROR: iPhoneOS16.4.sdk not found after extraction."

            echo
            echo "Extracted directories:"
            find "$WORK_DIR/extracted" \
              -maxdepth 5 \
              -type d \
              -print

            exit 1
          fi

          echo
          echo "Found:"
          echo "$SDK_SOURCE"

          rm -rf "$SDK_DIR/iPhoneOS16.4.sdk"

          cp -R \
            "$SDK_SOURCE" \
            "$SDK_DIR/iPhoneOS16.4.sdk"

          echo
          echo "=========================================="
          echo "          SDK INSTALLED"
          echo "=========================================="

          ls -ld "$SDK_DIR/iPhoneOS16.4.sdk"

          du -sh "$SDK_DIR/iPhoneOS16.4.sdk"

          test -f \
            "$SDK_DIR/iPhoneOS16.4.sdk/SDKSettings.plist"

          echo
          echo "SDKSettings:"
          plutil \
            -p \
            "$SDK_DIR/iPhoneOS16.4.sdk/SDKSettings.plist" \
            | head -100

      # ============================================================
      # VERIFY CARDculator
      # ============================================================

      - name: Verify Cardculator source
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "       CARDculator SOURCE"
          echo "=========================================="

          echo
          echo "Commit:"
          git rev-parse HEAD

          echo
          echo "control:"
          cat control

          echo
          echo "Makefile:"
          cat Makefile

          echo
          echo "=========================================="
          echo "              VERSION"
          echo "=========================================="

          grep -E \
            "^(Package|Version|Architecture):" \
            control

          VERSION=$(sed -n 's/^Version:[[:space:]]*//p' control)

          if [ "$VERSION" != "2.1.1" ]; then
            echo
            echo "ERROR: Expected Cardculator 2.1.1."
            echo "Found: $VERSION"
            exit 1
          fi

          echo
          echo "Cardculator 2.1.1 confirmed."

      # ============================================================
      # CLONE COMET
      # ============================================================

      - name: Clone Comet
        shell: bash
        run: |
          set -e

          COMET_DIR="$RUNNER_TEMP/Comet"

          rm -rf "$COMET_DIR"

          git clone \
            --recursive \
            https://github.com/ginsudev/Comet.git \
            "$COMET_DIR"

          cd "$COMET_DIR"

          git submodule update --init --recursive

          echo "=========================================="
          echo "                 COMET"
          echo "=========================================="

          echo
          echo "Remote:"
          git remote -v

          echo
          echo "Commit:"
          git rev-parse HEAD

          echo
          echo "Tags:"
          git tag --sort=-version:refname | head -50

          echo
          echo "Control:"
          cat control

          echo
          echo "Makefile:"
          cat Makefile

      # ============================================================
      # FIX COMET XCODE PATH
      #
      # Comet's build tree may contain an old:
      #
      # /Applications/Xcode-15.4.0.app
      #
      # Replace ONLY build-environment references.
      # ============================================================

      - name: Fix Comet Xcode configuration
        shell: bash
        run: |
          set -e

          COMET_DIR="$RUNNER_TEMP/Comet"

          cd "$COMET_DIR"

          export DEVELOPER_DIR="/Applications/Xcode_16.4.app/Contents/Developer"

          echo "=========================================="
          echo "       FIX COMET XCODE CONFIG"
          echo "=========================================="

          echo
          echo "Searching for Xcode 15.4 references..."

          grep -R \
            -n \
            --exclude-dir=.git \
            --exclude='*.o' \
            --exclude='*.a' \
            --exclude='*.dylib' \
            --exclude='*.framework' \
            "Xcode-15.4.0" \
            . \
            2>/dev/null \
            || true

          echo
          echo "Searching for DEVELOPER_DIR..."

          grep -R \
            -n \
            --exclude-dir=.git \
            "DEVELOPER_DIR" \
            . \
            2>/dev/null \
            || true

          echo
          echo "Replacing old Xcode path where present..."

          find . \
            -type f \
            -not -path './.git/*' \
            -not -path '*/.theos/*' \
            -exec grep -Il \
              "Xcode-15.4.0" \
              {} \; \
            2>/dev/null \
            | while read -r file; do
                echo "Patching: $file"
                sed -i '' \
                  's#/Applications/Xcode-15.4.0.app/Contents/Developer#/Applications/Xcode_16.4.app/Contents/Developer#g' \
                  "$file"
              done

          echo
          echo "Final DEVELOPER_DIR:"
          echo "$DEVELOPER_DIR"

          xcrun --find clang
          xcrun --find swift

      # ============================================================
      # BUILD COMET
      #
      # IMPORTANT:
      # Do NOT checkout an assumed 1.0.5 tag.
      #
      # The current Comet repository control file is authoritative.
      # ============================================================

      - name: Build Comet
        shell: bash
        run: |
          set -e

          COMET_DIR="$RUNNER_TEMP/Comet"

          cd "$COMET_DIR"

          export DEVELOPER_DIR="/Applications/Xcode_16.4.app/Contents/Developer"
          export THEOS="$GITHUB_WORKSPACE/theos"
          export THEOS_PACKAGE_SCHEME=rootless
          export FINALPACKAGE=1

          echo "=========================================="
          echo "              BUILD COMET"
          echo "=========================================="

          echo
          echo "Comet control:"
          cat control

          echo
          echo "Xcode:"
          xcodebuild -version

          echo
          echo "clang:"
          xcrun --find clang

          echo
          echo "swift:"
          xcrun --find swift

          echo
          echo "Cleaning..."

          make clean || true

          echo
          echo "Building Comet..."

          make package \
            THEOS_PACKAGE_SCHEME=rootless \
            FINALPACKAGE=1

          echo
          echo "=========================================="
          echo "             COMET PACKAGE"
          echo "=========================================="

          find packages \
            -maxdepth 1 \
            -type f \
            -name "*.deb" \
            -print

      # ============================================================
      # FIND COMET FRAMEWORK
      # ============================================================

      - name: Install Comet framework
        shell: bash
        run: |
          set -e

          COMET_DIR="$RUNNER_TEMP/Comet"

          echo "=========================================="
          echo "       COMET FRAMEWORK"
          echo "=========================================="

          COMET_FRAMEWORK=$(
            find "$COMET_DIR" \
              -type d \
              -name "Comet.framework" \
              -print \
              -quit
          )

          if [ -z "$COMET_FRAMEWORK" ]; then
            echo
            echo "ERROR: Comet.framework not found."

            echo
            echo "Searching build tree:"
            find "$COMET_DIR" \
              -maxdepth 6 \
              -print \
              | head -400

            exit 1
          fi

          echo
          echo "Found:"
          echo "$COMET_FRAMEWORK"

          TARGET="$THEOS/lib/iphone/rootless"

          mkdir -p "$TARGET"

          rm -rf "$TARGET/Comet.framework"

          cp -R \
            "$COMET_FRAMEWORK" \
            "$TARGET/Comet.framework"

          echo
          echo "Installed:"
          ls -la "$TARGET/Comet.framework"

          if [ ! -f "$TARGET/Comet.framework/Comet" ]; then
            echo
            echo "ERROR: Comet binary missing."
            exit 1
          fi

          echo
          echo "Binary:"
          file "$TARGET/Comet.framework/Comet"

          echo
          echo "Architecture:"
          lipo -info "$TARGET/Comet.framework/Comet"

      # ============================================================
      # REMOTELOG
      # ============================================================

      - name: Install RemoteLog.h
        shell: bash
        run: |
          set -e

          mkdir -p "$THEOS/include"

          curl \
            --fail \
            --retry 5 \
            --retry-all-errors \
            -L \
            https://raw.githubusercontent.com/Muirey03/RemoteLog/master/RemoteLog.h \
            -o "$THEOS/include/RemoteLog.h"

          test -f "$THEOS/include/RemoteLog.h"

          echo "RemoteLog.h installed."

      # ============================================================
      # THEOS SPM
      # ============================================================

      - name: Prepare Theos SPM
        shell: bash
        run: |
          set -e

          export DEVELOPER_DIR="/Applications/Xcode_16.4.app/Contents/Developer"
          export THEOS_PACKAGE_SCHEME=rootless

          echo "=========================================="
          echo "               THEOS SPM"
          echo "=========================================="

          make spm

          if [ -f ".theos/spm_config" ]; then
            echo
            echo ".theos/spm_config:"
            cat .theos/spm_config
          fi

      # ============================================================
      # BUILD CARDculator
      # ============================================================

      - name: Build Cardculator
        shell: bash
        run: |
          set -e

          export DEVELOPER_DIR="/Applications/Xcode_16.4.app/Contents/Developer"
          export THEOS_PACKAGE_SCHEME=rootless
          export FINALPACKAGE=1

          echo "=========================================="
          echo "       BUILD CARDculator 2.1.1"
          echo "=========================================="

          echo
          echo "Xcode:"
          xcodebuild -version

          echo
          echo "clang:"
          xcrun --find clang

          echo
          echo "swift:"
          xcrun --find swift

          echo
          echo "Theos:"
          echo "$THEOS"

          echo
          echo "Cleaning..."

          make clean || true

          echo
          echo "Building..."

          make package \
            THEOS_PACKAGE_SCHEME=rootless \
            FINALPACKAGE=1

      # ============================================================
      # VERIFY PACKAGE
      # ============================================================

      - name: Verify final package
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "        VERIFY CARDculator PACKAGE"
          echo "=========================================="

          CARD_DEB=$(
            find packages \
              -maxdepth 1 \
              -type f \
              -name "*.deb" \
              -print \
              | grep -v "com.ginsu.comet" \
              | head -1
          )

          if [ -z "$CARD_DEB" ]; then
            echo
            echo "ERROR: Cardculator .deb not found."

            echo
            echo "Packages directory:"
            find packages \
              -maxdepth 1 \
              -type f \
              -print \
              2>/dev/null \
              || true

            exit 1
          fi

          echo
          echo "Package:"
          echo "$CARD_DEB"

          echo
          echo "Control:"
          dpkg-deb -f "$CARD_DEB"

          echo
          echo "Version:"
          VERSION=$(dpkg-deb -f "$CARD_DEB" Version)
          echo "$VERSION"

          case "$VERSION" in
            2.1.1|2.1.1-*)
              echo "Cardculator 2.1.1 confirmed."
              ;;
            *)
              echo "ERROR: Expected 2.1.1."
              exit 1
              ;;
          esac

          echo
          echo "Architecture:"
          dpkg-deb -f "$CARD_DEB" Architecture

          echo
          echo "Depends:"
          dpkg-deb -f "$CARD_DEB" Depends || true

          echo
          echo "Contents:"
          dpkg-deb -c "$CARD_DEB"

          echo
          echo "=========================================="
          echo "             VERIFICATION OK"
          echo "=========================================="

      # ============================================================
      # UPLOAD
      # ============================================================

      - name: Upload Cardculator
        uses: actions/upload-artifact@v4
        with:
          name: Cardculator-2.1.1-rootless
          path: packages/*.deb
          if-no-files-found: error
          retention-days: 30

      # ============================================================
      # DIAGNOSTICS
      # ============================================================

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Cardculator-build-diagnostics
          path: |
            packages/*.deb
            .theos/spm_config
          if-no-files-found: ignore
          retention-days: 30
