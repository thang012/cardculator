name: Build Cardculator 2.1.1

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15

    env:
      THEOS: ${{ github.workspace }}/theos
      THEOS_PACKAGE_SCHEME: rootless
      FINALPACKAGE: 1

    steps:

      # ============================================================
      # CHECKOUT
      # ============================================================

      - name: Checkout Cardculator
        uses: actions/checkout@v4


      # ============================================================
      # XCODE
      # macos-15 provides Xcode 16.4
      # ============================================================

      - name: Select Xcode 16.4
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "16.4"

      - name: Verify Xcode
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "                 XCODE"
          echo "=========================================="

          xcode-select -p
          xcodebuild -version

          echo
          echo "Available iPhoneOS SDKs:"
          xcodebuild -showsdks | grep -i iphoneos || true


      # ============================================================
      # INSTALL THEOS
      # ============================================================

      - name: Install Theos
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "                THEOS"
          echo "=========================================="

          rm -rf "$THEOS"

          git clone \
            --recursive \
            https://github.com/theos/theos.git \
            "$THEOS"

          cd "$THEOS"

          git submodule update --init --recursive

          echo
          echo "THEOS:"
          echo "$THEOS"

          echo
          echo "Theos commit:"
          git rev-parse HEAD

          echo
          echo "Theos version:"
          git log -1 --oneline


      # ============================================================
      # INSTALL LDID
      # ============================================================

      - name: Install ldid
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "                 LDID"
          echo "=========================================="

          brew install ldid

          command -v ldid

          echo
          ldid --version 2>&1 || true


      # ============================================================
      # INSTALL iPhoneOS 16.4 SDK
      #
      # IMPORTANT:
      #
      # Do NOT use the old GitHub release API.
      #
      # xybp888/iOS-SDKs contains the actual SDK directory:
      #
      #   iPhoneOS16.4.sdk/
      #
      # Cardculator Makefile explicitly requires:
      #
      #   THEOS/sdks/iPhoneOS16.4.sdk
      # ============================================================

      - name: Install iPhoneOS 16.4 SDK
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "       INSTALL iPhoneOS 16.4 SDK"
          echo "=========================================="

          SDK_DIR="$THEOS/sdks"
          SDK_SOURCE="/tmp/iOS-SDKs/iPhoneOS16.4.sdk"
          SDK_DEST="$SDK_DIR/iPhoneOS16.4.sdk"

          rm -rf "/tmp/iOS-SDKs"
          rm -rf "$SDK_DEST"

          mkdir -p "$SDK_DIR"

          echo
          echo "Cloning iOS-SDKs repository..."

          git clone \
            --depth 1 \
            --filter=blob:none \
            --sparse \
            https://github.com/xybp888/iOS-SDKs.git \
            /tmp/iOS-SDKs

          cd /tmp/iOS-SDKs

          echo
          echo "Enabling iPhoneOS16.4.sdk..."

          git sparse-checkout set iPhoneOS16.4.sdk

          echo
          echo "Checking SDK source..."

          if [ ! -d "$SDK_SOURCE" ]; then
            echo
            echo "ERROR: iPhoneOS16.4.sdk was not found."
            echo
            echo "Repository contents:"
            find /tmp/iOS-SDKs -maxdepth 2 -type d -print
            exit 1
          fi

          echo
          echo "SDK source:"
          echo "$SDK_SOURCE"

          echo
          echo "SDK size:"
          du -sh "$SDK_SOURCE"

          echo
          echo "SDKSettings:"
          test -f "$SDK_SOURCE/SDKSettings.plist"

          echo "SDKSettings.plist found."

          echo
          echo "Installing SDK into Theos..."

          cp -R \
            "$SDK_SOURCE" \
            "$SDK_DEST"

          echo
          echo "=========================================="
          echo "       INSTALLED iPhoneOS 16.4 SDK"
          echo "=========================================="

          ls -ld "$SDK_DEST"

          du -sh "$SDK_DEST"

          echo
          echo "SDKSettings.plist:"
          plutil \
            -p \
            "$SDK_DEST/SDKSettings.plist" \
            | head -100

          echo
          echo "SDK verification:"

          test -d "$SDK_DEST"
          test -f "$SDK_DEST/SDKSettings.plist"
          test -d "$SDK_DEST/System"
          test -d "$SDK_DEST/usr"

          echo
          echo "iPhoneOS 16.4 SDK installed successfully."


      # ============================================================
      # VERIFY CARDculator SOURCE
      # ============================================================

      - name: Verify Cardculator source
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "        CARDculator SOURCE"
          echo "=========================================="

          echo
          echo "Git commit:"
          git rev-parse HEAD

          echo
          echo "Git status:"
          git status --short

          echo
          echo "=========================================="
          echo "              CONTROL"
          echo "=========================================="

          cat control

          echo
          echo "=========================================="
          echo "             MAKEFILE"
          echo "=========================================="

          cat Makefile

          echo
          echo "=========================================="
          echo "          VERIFY VERSION"
          echo "=========================================="

          VERSION=$(grep '^Version:' control | awk '{print $2}')

          echo "Detected version: $VERSION"

          if [ "$VERSION" != "2.1.1" ]; then
            echo
            echo "ERROR: Expected Cardculator 2.1.1."
            exit 1
          fi

          echo
          echo "Cardculator 2.1.1 confirmed."

          echo
          echo "=========================================="
          echo "           VERIFY SDK TARGET"
          echo "=========================================="

          if grep -q 'TARGET := iphone:clang:16.4:13.0' Makefile; then
            echo "SDK target confirmed:"
            echo "iphone:clang:16.4:13.0"
          else
            echo
            echo "ERROR: Expected SDK target not found."
            exit 1
          fi

          echo
          echo "=========================================="
          echo "           VERIFY SYSROOT"
          echo "=========================================="

          if grep -q 'iPhoneOS16.4.sdk' Makefile; then
            echo "Sysroot target confirmed:"
            echo "iPhoneOS16.4.sdk"
          else
            echo
            echo "ERROR: iPhoneOS16.4.sdk reference not found."
            exit 1
          fi


      # ============================================================
      # VERIFY THEOS SDK
      # ============================================================

      - name: Verify Theos SDK
        shell: bash
        run: |
          set -e

          SDK="$THEOS/sdks/iPhoneOS16.4.sdk"

          echo "=========================================="
          echo "            VERIFY THEOS SDK"
          echo "=========================================="

          echo
          echo "SDK:"
          echo "$SDK"

          test -d "$SDK"
          test -f "$SDK/SDKSettings.plist"

          echo
          echo "SDK directory:"
          ls -ld "$SDK"

          echo
          echo "SDK size:"
          du -sh "$SDK"

          echo
          echo "SDK settings:"
          plutil -p "$SDK/SDKSettings.plist" | head -80


      # ============================================================
      # CLONE COMET
      #
      # Cardculator depends on:
      #
      #   com.ginsu.comet
      #
      # Comet is a SwiftUI preference framework.
      # ============================================================

      - name: Clone Comet
        shell: bash
        run: |
          set -e

          COMET_DIR="$RUNNER_TEMP/Comet"

          rm -rf "$COMET_DIR"

          echo "=========================================="
          echo "                COMET"
          echo "=========================================="

          git clone \
            https://github.com/ginsudev/Comet.git \
            "$COMET_DIR"

          cd "$COMET_DIR"

          git fetch --all --tags

          echo
          echo "Remote:"
          git remote -v

          echo
          echo "Current commit:"
          git rev-parse HEAD

          echo
          echo "Available tags:"
          git tag --sort=-version:refname | head -30

          echo
          echo "Comet control:"
          cat control

          echo
          echo "Comet Makefile:"
          cat Makefile


      # ============================================================
      # BUILD COMET
      #
      # Do not assume a specific tag exists.
      #
      # Cardculator only needs the Comet framework matching the
      # com.ginsu.comet dependency.
      # ============================================================

      - name: Build Comet
        shell: bash
        run: |
          set -e

          COMET_DIR="$RUNNER_TEMP/Comet"

          cd "$COMET_DIR"

          echo "=========================================="
          echo "             BUILD COMET"
          echo "=========================================="

          echo
          echo "Comet version from control:"
          grep -E '^(Version|Package|Architecture):' control || true

          echo
          echo "Cleaning..."

          make clean || true

          echo
          echo "Building Comet..."

          make package \
            THEOS_PACKAGE_SCHEME=rootless \
            FINALPACKAGE=1

          echo
          echo "=========================================="
          echo "            COMET PACKAGE"
          echo "=========================================="

          find packages \
            -maxdepth 1 \
            -type f \
            -name "*.deb" \
            -print

          echo
          echo "Searching for Comet.framework..."

          find "$COMET_DIR" \
            -type d \
            -name "Comet.framework" \
            -print


      # ============================================================
      # INSTALL COMET FRAMEWORK
      #
      # Comet README explicitly states that the framework can be
      # copied into:
      #
      #   $(THEOS)/lib/
      #
      # We use the rootless Theos lib directory.
      # ============================================================

      - name: Install Comet framework
        shell: bash
        run: |
          set -e

          COMET_DIR="$RUNNER_TEMP/Comet"

          echo "=========================================="
          echo "         INSTALL COMET FRAMEWORK"
          echo "=========================================="

          echo
          echo "Searching for Comet.framework..."

          COMET_FRAMEWORK=$(
            find "$COMET_DIR" \
              -type d \
              -name "Comet.framework" \
              -print \
              -quit
          )

          if [ -z "$COMET_FRAMEWORK" ]; then
            echo
            echo "ERROR: Comet.framework was not found."
            echo
            echo "Comet tree:"
            find "$COMET_DIR" \
              -maxdepth 6 \
              -print \
              | head -400

            exit 1
          fi

          echo
          echo "Found:"
          echo "$COMET_FRAMEWORK"

          TARGET="$THEOS/lib"

          mkdir -p "$TARGET"

          rm -rf "$TARGET/Comet.framework"

          cp -R \
            "$COMET_FRAMEWORK" \
            "$TARGET/Comet.framework"

          echo
          echo "Installed framework:"
          ls -la "$TARGET/Comet.framework"

          if [ ! -f "$TARGET/Comet.framework/Comet" ]; then
            echo
            echo "ERROR: Comet framework binary is missing."
            exit 1
          fi

          echo
          echo "Comet binary:"
          file "$TARGET/Comet.framework/Comet"

          echo
          echo "Comet architectures:"
          lipo -info "$TARGET/Comet.framework/Comet"

          echo
          echo "Comet framework verified."


      # ============================================================
      # REMOTELOG
      # ============================================================

      - name: Install RemoteLog.h
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "            REMOTELOG.H"
          echo "=========================================="

          mkdir -p "$THEOS/include"

          curl \
            --fail \
            --retry 3 \
            --retry-all-errors \
            -L \
            https://raw.githubusercontent.com/Muirey03/RemoteLog/master/RemoteLog.h \
            -o "$THEOS/include/RemoteLog.h"

          test -f "$THEOS/include/RemoteLog.h"

          echo "RemoteLog.h installed."


      # ============================================================
      # PREPARE THEOS SPM
      # ============================================================

      - name: Prepare Theos SPM
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "              THEOS SPM"
          echo "=========================================="

          export THEOS_PACKAGE_SCHEME=rootless

          make spm

          echo
          echo "SPM output:"

          if [ -f ".theos/spm_config" ]; then
            cat ".theos/spm_config"
          else
            echo
            echo "ERROR: .theos/spm_config was not generated."
            exit 1
          fi


      # ============================================================
      # BUILD CARDculator
      # ============================================================

      - name: Build Cardculator
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "       BUILD CARDculator 2.1.1"
          echo "=========================================="

          export THEOS_PACKAGE_SCHEME=rootless
          export FINALPACKAGE=1

          make clean || true

          make \
            THEOS_PACKAGE_SCHEME=rootless \
            FINALPACKAGE=1


      # ============================================================
      # FIND BUILD OUTPUT
      # ============================================================

      - name: Find build output
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "             BUILD OUTPUT"
          echo "=========================================="

          echo
          echo "Packages directory:"

          if [ -d packages ]; then
            ls -lah packages
          else
            echo "ERROR: packages directory does not exist."
            exit 1
          fi

          echo
          echo "All deb files:"

          find packages \
            -maxdepth 1 \
            -type f \
            -name "*.deb" \
            -print


      # ============================================================
      # INSPECT PREFS.BUNDLE
      # ============================================================

      - name: Inspect prefs.bundle
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "          INSPECT PREFS.BUNDLE"
          echo "=========================================="

          PREF_BUNDLE=$(
            find . \
              -type d \
              -name "prefs.bundle" \
              -print \
              -quit
          )

          if [ -z "$PREF_BUNDLE" ]; then
            echo
            echo "ERROR: prefs.bundle was not found."

            echo
            echo "Available bundles:"

            find . \
              -type d \
              -name "*.bundle" \
              -print

            exit 1
          fi

          echo
          echo "prefs.bundle:"
          echo "$PREF_BUNDLE"

          echo
          echo "Contents:"

          find "$PREF_BUNDLE" \
            -maxdepth 3 \
            -print


      # ============================================================
      # PACKAGE CARDculator
      # ============================================================

      - name: Package Cardculator
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "          PACKAGE CARDculator"
          echo "=========================================="

          export THEOS_PACKAGE_SCHEME=rootless
          export FINALPACKAGE=1

          rm -rf packages/*.deb

          make package \
            THEOS_PACKAGE_SCHEME=rootless \
            FINALPACKAGE=1

          echo
          echo "Generated packages:"

          find packages \
            -maxdepth 1 \
            -type f \
            -name "*.deb" \
            -print

          CARD_DEB=$(
            find packages \
              -maxdepth 1 \
              -type f \
              -name "*.deb" \
              -print \
              | grep -v "com.ginsu.comet" \
              | head -1
          )

          if [ -z "$CARD_DEB" ]; then
            echo
            echo "ERROR: Cardculator .deb was not produced."
            exit 1
          fi

          echo
          echo "Cardculator package:"
          echo "$CARD_DEB"


      # ============================================================
      # VERIFY FINAL DEB
      # ============================================================

      - name: Verify final package
        shell: bash
        run: |
          set -e

          CARD_DEB=$(
            find packages \
              -maxdepth 1 \
              -type f \
              -name "*.deb" \
              -print \
              | grep -v "com.ginsu.comet" \
              | head -1
          )

          if [ -z "$CARD_DEB" ]; then
            echo "ERROR: Cardculator package not found."
            exit 1
          fi

          echo "=========================================="
          echo "          PACKAGE CONTROL"
          echo "=========================================="

          dpkg-deb -I "$CARD_DEB"

          echo
          echo "=========================================="
          echo "         PACKAGE CONTENTS"
          echo "=========================================="

          dpkg-deb -c "$CARD_DEB"

          echo
          echo "=========================================="
          echo "          PACKAGE VERSION"
          echo "=========================================="

          VERSION=$(dpkg-deb -f "$CARD_DEB" Version)

          echo "Version: $VERSION"

          if [ "$VERSION" != "2.1.1" ]; then
            echo
            echo "ERROR: Expected Cardculator 2.1.1."
            exit 1
          fi

          echo
          echo "=========================================="
          echo "        PACKAGE ARCHITECTURE"
          echo "=========================================="

          ARCH=$(dpkg-deb -f "$CARD_DEB" Architecture)

          echo "Architecture: $ARCH"

          echo
          echo "=========================================="
          echo "           PACKAGE DEPENDS"
          echo "=========================================="

          dpkg-deb -f "$CARD_DEB" Depends || true

          echo
          echo "=========================================="
          echo "        VERIFY COMET DEPENDENCY"
          echo "=========================================="

          DEPENDS=$(dpkg-deb -f "$CARD_DEB" Depends || true)

          if echo "$DEPENDS" | grep -q "com.ginsu.comet"; then
            echo "com.ginsu.comet dependency confirmed."
          else
            echo
            echo "ERROR: com.ginsu.comet dependency missing."
            exit 1
          fi

          echo
          echo "=========================================="
          echo "        VERIFY PREFS.BUNDLE"
          echo "=========================================="

          if dpkg-deb -c "$CARD_DEB" \
            | grep -q "Library/PreferenceBundles/prefs.bundle"; then
            echo "prefs.bundle confirmed."
          else
            echo
            echo "ERROR: prefs.bundle missing from package."
            exit 1
          fi

          echo
          echo "=========================================="
          echo "      VERIFY CONTROL CENTER MODULE"
          echo "=========================================="

          if dpkg-deb -c "$CARD_DEB" \
            | grep -q "CardculatorCCModule.bundle"; then
            echo "CardculatorCCModule.bundle confirmed."
          else
            echo
            echo "ERROR: CardculatorCCModule.bundle missing."
            exit 1
          fi

          echo
          echo "=========================================="
          echo "       FINAL PACKAGE VERIFICATION OK"
          echo "=========================================="


      # ============================================================
      # UPLOAD CARDculator
      # ============================================================

      - name: Upload Cardculator package
        uses: actions/upload-artifact@v4
        with:
          name: Cardculator-2.1.1-rootless
          path: packages/*.deb
          if-no-files-found: error
          retention-days: 30


      # ============================================================
      # DIAGNOSTICS
      # ============================================================

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Cardculator-build-diagnostics
          path: |
            packages/*.deb
            .theos/spm_config
          if-no-files-found: ignore
          retention-days: 30
