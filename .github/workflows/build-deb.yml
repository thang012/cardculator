name: Build Cardculator 2.1.1

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15

    env:
      THEOS: ${{ github.workspace }}/theos
      THEOS_PACKAGE_SCHEME: rootless
      FINALPACKAGE: 1

    steps:

      # ============================================================
      # CHECKOUT
      # ============================================================

      - name: Checkout Cardculator
        uses: actions/checkout@v4


      # ============================================================
      # XCODE
      # ============================================================

      - name: Select Xcode 16.4
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "16.4"

      - name: Verify Xcode
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "                 XCODE"
          echo "=========================================="

          xcode-select -p
          xcodebuild -version
          xcodebuild -showsdks


      # ============================================================
      # THEOS
      # ============================================================

      - name: Install Theos
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "                 THEOS"
          echo "=========================================="

          rm -rf "$THEOS"

          git clone \
            --recursive \
            https://github.com/theos/theos.git \
            "$THEOS"

          cd "$THEOS"

          git submodule update --init --recursive

          echo
          echo "THEOS:"
          echo "$THEOS"

          echo
          echo "Theos commit:"
          git rev-parse HEAD


      # ============================================================
      # LDID
      # ============================================================

      - name: Install ldid
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "                  LDID"
          echo "=========================================="

          brew install ldid

          command -v ldid

          ldid --version 2>&1 || true


      # ============================================================
      # iPhoneOS 16.4 SDK
      #
      # Required by Cardculator:
      #
      #   iphone:clang:16.4:13.0
      #
      # Installed as:
      #
      #   $THEOS/sdks/iPhoneOS16.4.sdk
      # ============================================================

      - name: Install iPhoneOS 16.4 SDK
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "       INSTALL iPhoneOS 16.4 SDK"
          echo "=========================================="

          SDK_DIR="$THEOS/sdks"
          REPO="/tmp/iOS-SDKs"

          rm -rf "$REPO"
          rm -rf "$SDK_DIR/iPhoneOS16.4.sdk"

          mkdir -p "$SDK_DIR"

          git clone \
            --depth 1 \
            --filter=blob:none \
            --sparse \
            https://github.com/xybp888/iOS-SDKs.git \
            "$REPO"

          cd "$REPO"

          git sparse-checkout set iPhoneOS16.4.sdk

          SDK_SOURCE="$REPO/iPhoneOS16.4.sdk"
          SDK_DEST="$SDK_DIR/iPhoneOS16.4.sdk"

          if [ ! -d "$SDK_SOURCE" ]; then
            echo "ERROR: iPhoneOS16.4.sdk not found."
            find "$REPO" -maxdepth 2 -type d -print
            exit 1
          fi

          cp -R "$SDK_SOURCE" "$SDK_DEST"

          test -d "$SDK_DEST"
          test -f "$SDK_DEST/SDKSettings.plist"

          echo
          echo "Installed:"
          ls -ld "$SDK_DEST"

          echo
          echo "Size:"
          du -sh "$SDK_DEST"


      # ============================================================
      # iPhoneOS 16.5 SDK
      #
      # Required by Comet 1.0.0.
      #
      # Comet's Makefile selects:
      #
      #   iPhoneOS16.5.sdk
      #
      # We install BOTH 16.4 and 16.5 so each project can use
      # its original SDK target without modifying either source.
      # ============================================================

      - name: Install iPhoneOS 16.5 SDK
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "       INSTALL iPhoneOS 16.5 SDK"
          echo "=========================================="

          SDK_DIR="$THEOS/sdks"
          REPO="/tmp/iOS-SDKs"

          rm -rf "$REPO"
          rm -rf "$SDK_DIR/iPhoneOS16.5.sdk"

          mkdir -p "$SDK_DIR"

          git clone \
            --depth 1 \
            --filter=blob:none \
            --sparse \
            https://github.com/xybp888/iOS-SDKs.git \
            "$REPO"

          cd "$REPO"

          git sparse-checkout set iPhoneOS16.5.sdk

          SDK_SOURCE="$REPO/iPhoneOS16.5.sdk"
          SDK_DEST="$SDK_DIR/iPhoneOS16.5.sdk"

          if [ ! -d "$SDK_SOURCE" ]; then
            echo "ERROR: iPhoneOS16.5.sdk not found."
            find "$REPO" -maxdepth 2 -type d -print
            exit 1
          fi

          cp -R "$SDK_SOURCE" "$SDK_DEST"

          test -d "$SDK_DEST"
          test -f "$SDK_DEST/SDKSettings.plist"

          echo
          echo "Installed:"
          ls -ld "$SDK_DEST"

          echo
          echo "Size:"
          du -sh "$SDK_DEST"


      # ============================================================
      # VERIFY SDKs
      # ============================================================

      - name: Verify Theos SDKs
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "              THEOS SDKS"
          echo "=========================================="

          echo
          echo "SDK directory:"
          ls -lah "$THEOS/sdks"

          echo
          echo "iPhoneOS 16.4:"
          test -f "$THEOS/sdks/iPhoneOS16.4.sdk/SDKSettings.plist"
          echo "OK"

          echo
          echo "iPhoneOS 16.5:"
          test -f "$THEOS/sdks/iPhoneOS16.5.sdk/SDKSettings.plist"
          echo "OK"


      # ============================================================
      # VERIFY CARDculator
      # ============================================================

      - name: Verify Cardculator source
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "        CARDculator SOURCE"
          echo "=========================================="

          echo
          echo "Commit:"
          git rev-parse HEAD

          echo
          echo "Control:"
          cat control

          echo
          echo "Makefile:"
          cat Makefile

          echo
          echo "=========================================="
          echo "          VERIFY VERSION"
          echo "=========================================="

          VERSION=$(grep '^Version:' control | awk '{print $2}')

          echo "Version: $VERSION"

          if [ "$VERSION" != "2.1.1" ]; then
            echo "ERROR: Expected Cardculator 2.1.1."
            exit 1
          fi

          echo "Cardculator 2.1.1 confirmed."

          echo
          echo "=========================================="
          echo "            VERIFY SDK TARGET"
          echo "=========================================="

          grep -n \
            'iphone:clang:16.4:13.0' \
            Makefile

          echo
          echo "Cardculator SDK target confirmed."


      # ============================================================
      # COMET
      # ============================================================

      - name: Clone Comet
        shell: bash
        run: |
          set -e

          COMET_DIR="$RUNNER_TEMP/Comet"

          rm -rf "$COMET_DIR"

          echo "=========================================="
          echo "                 COMET"
          echo "=========================================="

          git clone \
            https://github.com/ginsudev/Comet.git \
            "$COMET_DIR"

          cd "$COMET_DIR"

          git fetch --all --tags

          echo
          echo "Commit:"
          git rev-parse HEAD

          echo
          echo "Control:"
          cat control

          echo
          echo "Makefile:"
          cat Makefile


      # ============================================================
      # VERIFY COMET SDK
      # ============================================================

      - name: Verify Comet SDK target
        shell: bash
        run: |
          set -e

          COMET_DIR="$RUNNER_TEMP/Comet"

          cd "$COMET_DIR"

          echo "=========================================="
          echo "          VERIFY COMET SDK"
          echo "=========================================="

          echo
          echo "Comet target references:"

          grep -n \
            -E \
            '16\.5|SDK' \
            Makefile \
            || true

          echo
          echo "Checking iPhoneOS16.5.sdk..."

          test -d "$THEOS/sdks/iPhoneOS16.5.sdk"
          test -f "$THEOS/sdks/iPhoneOS16.5.sdk/SDKSettings.plist"

          echo "iPhoneOS16.5.sdk is available."


      # ============================================================
      # BUILD COMET
      # ============================================================

      - name: Build Comet
        shell: bash
        run: |
          set -e

          COMET_DIR="$RUNNER_TEMP/Comet"

          cd "$COMET_DIR"

          echo "=========================================="
          echo "              BUILD COMET"
          echo "=========================================="

          echo
          echo "Comet control:"
          grep -E \
            '^(Package|Architecture|Version):' \
            control

          echo
          echo "Cleaning..."

          make clean || true

          echo
          echo "Building..."

          make package \
            THEOS_PACKAGE_SCHEME=rootless \
            FINALPACKAGE=1

          echo
          echo "=========================================="
          echo "             COMET OUTPUT"
          echo "=========================================="

          find packages \
            -maxdepth 1 \
            -type f \
            -name "*.deb" \
            -print

          echo
          echo "Searching for Comet.framework..."

          find "$COMET_DIR" \
            -type d \
            -name "Comet.framework" \
            -print


      # ============================================================
      # INSTALL COMET FRAMEWORK
      # ============================================================

      - name: Install Comet framework
        shell: bash
        run: |
          set -e

          COMET_DIR="$RUNNER_TEMP/Comet"

          echo "=========================================="
          echo "         INSTALL COMET FRAMEWORK"
          echo "=========================================="

          COMET_FRAMEWORK=$(
            find "$COMET_DIR" \
              -type d \
              -name "Comet.framework" \
              -print \
              -quit
          )

          if [ -z "$COMET_FRAMEWORK" ]; then
            echo
            echo "ERROR: Comet.framework was not found."

            echo
            echo "Comet build tree:"

            find "$COMET_DIR" \
              -maxdepth 7 \
              -print \
              | head -500

            exit 1
          fi

          echo
          echo "Found:"
          echo "$COMET_FRAMEWORK"

          TARGET="$THEOS/lib"

          mkdir -p "$TARGET"

          rm -rf "$TARGET/Comet.framework"

          cp -R \
            "$COMET_FRAMEWORK" \
            "$TARGET/Comet.framework"

          echo
          echo "Installed:"
          ls -la "$TARGET/Comet.framework"

          test -f "$TARGET/Comet.framework/Comet"

          echo
          echo "Binary:"
          file "$TARGET/Comet.framework/Comet"

          echo
          echo "Architecture:"
          lipo -info "$TARGET/Comet.framework/Comet"


      # ============================================================
      # REMOTELOG
      # ============================================================

      - name: Install RemoteLog.h
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "              REMOTELOG"
          echo "=========================================="

          mkdir -p "$THEOS/include"

          curl \
            --fail \
            --retry 3 \
            --retry-all-errors \
            -L \
            https://raw.githubusercontent.com/Muirey03/RemoteLog/master/RemoteLog.h \
            -o "$THEOS/include/RemoteLog.h"

          test -f "$THEOS/include/RemoteLog.h"

          echo "RemoteLog.h installed."


      # ============================================================
      # THEOS SPM
      # ============================================================

      - name: Prepare Theos SPM
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "              THEOS SPM"
          echo "=========================================="

          export THEOS_PACKAGE_SCHEME=rootless

          make spm

          echo
          echo "SPM config:"

          if [ -f ".theos/spm_config" ]; then
            cat ".theos/spm_config"
          else
            echo "ERROR: .theos/spm_config was not generated."
            exit 1
          fi


      # ============================================================
      # BUILD CARDculator
      # ============================================================

      - name: Build Cardculator
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "       BUILD CARDculator 2.1.1"
          echo "=========================================="

          export THEOS_PACKAGE_SCHEME=rootless
          export FINALPACKAGE=1

          make clean || true

          make \
            THEOS_PACKAGE_SCHEME=rootless \
            FINALPACKAGE=1


      # ============================================================
      # PACKAGE
      # ============================================================

      - name: Package Cardculator
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "          PACKAGE CARDculator"
          echo "=========================================="

          export THEOS_PACKAGE_SCHEME=rootless
          export FINALPACKAGE=1

          make package \
            THEOS_PACKAGE_SCHEME=rootless \
            FINALPACKAGE=1

          echo
          echo "Packages:"

          find packages \
            -maxdepth 1 \
            -type f \
            -name "*.deb" \
            -print


      # ============================================================
      # VERIFY FINAL PACKAGE
      # ============================================================

      - name: Verify final package
        shell: bash
        run: |
          set -e

          CARD_DEB=$(
            find packages \
              -maxdepth 1 \
              -type f \
              -name "*.deb" \
              -print \
              | grep -v "com.ginsu.comet" \
              | head -1
          )

          if [ -z "$CARD_DEB" ]; then
            echo "ERROR: Cardculator .deb not found."
            exit 1
          fi

          echo "=========================================="
          echo "           CARDculator DEB"
          echo "=========================================="

          echo
          echo "File:"
          echo "$CARD_DEB"

          echo
          echo "Control:"
          dpkg-deb -I "$CARD_DEB"

          echo
          echo "Contents:"
          dpkg-deb -c "$CARD_DEB"

          echo
          echo "=========================================="
          echo "              VERSION"
          echo "=========================================="

          VERSION=$(dpkg-deb -f "$CARD_DEB" Version)

          echo "Version: $VERSION"

          if [ "$VERSION" != "2.1.1" ]; then
            echo "ERROR: Expected version 2.1.1."
            exit 1
          fi

          echo
          echo "=========================================="
          echo "             DEPENDS"
          echo "=========================================="

          DEPENDS=$(dpkg-deb -f "$CARD_DEB" Depends || true)

          echo "$DEPENDS"

          if ! echo "$DEPENDS" | grep -q "com.ginsu.comet"; then
            echo
            echo "ERROR: com.ginsu.comet dependency missing."
            exit 1
          fi

          echo
          echo "com.ginsu.comet dependency confirmed."

          echo
          echo "=========================================="
          echo "          PREFS.BUNDLE"
          echo "=========================================="

          if ! dpkg-deb -c "$CARD_DEB" \
            | grep -q "Library/PreferenceBundles/prefs.bundle"; then
            echo "ERROR: prefs.bundle missing."
            exit 1
          fi

          echo "prefs.bundle confirmed."

          echo
          echo "=========================================="
          echo "       CONTROL CENTER MODULE"
          echo "=========================================="

          if ! dpkg-deb -c "$CARD_DEB" \
            | grep -q "CardculatorCCModule.bundle"; then
            echo "ERROR: CardculatorCCModule.bundle missing."
            exit 1
          fi

          echo "CardculatorCCModule.bundle confirmed."

          echo
          echo "=========================================="
          echo "        BUILD VERIFICATION OK"
          echo "=========================================="


      # ============================================================
      # UPLOAD
      # ============================================================

      - name: Upload Cardculator package
        uses: actions/upload-artifact@v4
        with:
          name: Cardculator-2.1.1-rootless
          path: packages/*.deb
          if-no-files-found: error
          retention-days: 30


      # ============================================================
      # DIAGNOSTICS
      # ============================================================

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Cardculator-build-diagnostics
          path: |
            packages/*.deb
            .theos/spm_config
          if-no-files-found: ignore
          retention-days: 30
