name: Build Cardculator .deb

on:
  workflow_dispatch:   # cho phép bấm nút "Run workflow" thủ công trên GitHub
  push:
    branches: [main]

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout Cardculator source
        uses: actions/checkout@v4

      - name: List available Xcode versions
        run: ls /Applications | grep -i xcode

      - name: Select and pin correct Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode.app
          echo "DEVELOPER_DIR=/Applications/Xcode.app/Contents/Developer" >> $GITHUB_ENV
          xcodebuild -version

      # Theos có một tham chiếu cứng tới đường dẫn Xcode-15.4.0.app ở đâu đó
      # trong quá trình build swift-support. Tạo symlink giả để thoả điều kiện đó.
      - name: Workaround hardcoded Xcode-15.4.0.app path
        run: |
          sudo ln -sf /Applications/Xcode.app /Applications/Xcode-15.4.0.app
          ls -la /Applications/Xcode-15.4.0.app
          
      # ---------- Cài Theos ----------
      - name: Install Theos
        run: |
          export THEOS=$HOME/theos
          git clone --recursive https://github.com/theos/theos.git $THEOS
          echo "THEOS=$THEOS" >> $GITHUB_ENV

      - name: Switch Theos to orion branch
        run: |
          cd $THEOS
          git fetch && git checkout orion && git submodule update --init

      # ---------- Tải iPhoneOS SDK hiện đại (khớp Swift compiler của Xcode 16.4) ----------
      - name: Download iPhoneOS18.4.sdk
        run: |
          mkdir -p "$THEOS/sdks"
          curl -L -o /tmp/iPhoneOS18.4.sdk.zip \
            "https://github.com/xybp888/iOS-SDKs/releases/download/iOS18.4-SDKs/iPhoneOS18.4.sdk.zip"
          unzip -q /tmp/iPhoneOS18.4.sdk.zip -d "$THEOS/sdks"
          echo "----- Nội dung $THEOS/sdks -----"
          ls -la "$THEOS/sdks"
          du -sh "$THEOS/sdks"/iPhoneOS18.4.sdk

      # ---------- Build Comet (thư viện SwiftUI cho preferences) ----------
      - name: Clone and build Comet
        run: |
          unset DEVELOPER_DIR
          echo "Active Xcode: $(xcode-select -p)"

          # Cài ldid để ký framework
          brew install ldid

          mkdir -p $HOME/developer
          cd $HOME/developer
          git clone https://github.com/ginsudev/Comet.git
          cd Comet

          sed -i '' 's|TARGET = iphone:clang:16.5:14.5|TARGET = iphone:clang:18.4:14.5|' Makefile

          cat > Sources/CometC/include/LSApplicationWorkspace.h << 'EOF'
          #import <Foundation/Foundation.h>
          NS_ASSUME_NONNULL_BEGIN
          @interface LSApplicationRecord : NSObject
          @property (readonly) NSArray<NSString *> * appTags;
          @property (getter=isLaunchProhibited,readonly) BOOL launchProhibited;
          @end
          @interface LSApplicationProxy : NSObject
          @property (nonatomic,readonly) LSApplicationRecord * correspondingApplicationRecord;
          @property (nonatomic,readonly) NSString * applicationType;
          @property (nonatomic,readonly) NSString * applicationIdentifier;
          @property (nonatomic,readonly) NSString * localizedName;
          @property (nonatomic,readonly) NSURL * bundleURL;
          + (instancetype)applicationProxyForIdentifier:(NSString *)identifier;
          @end
          @interface LSApplicationWorkspace : NSObject
          + (instancetype)defaultWorkspace;
          - (NSArray<LSApplicationProxy *> *)allApplications;
          - (NSArray<LSApplicationProxy *> *)allInstalledApplications;
          - (BOOL)openApplicationWithBundleID:(NSString *)bundleID;
          @end
          NS_ASSUME_NONNULL_END
          EOF

          cat > Sources/Comet/Core/Extensions/Bundle+Comet.swift << 'EOF'
          import Foundation
          internal extension Bundle {
              static var comet: Bundle {
                  Bundle(path: "/var/jb/Library/Frameworks/Comet.framework/Bundle.bundle/")!
              }
          }
          EOF

          sed -i '' \
            -e 's/guard let proxies = LSApplicationWorkspace.default().allApplications() else {/let proxies = LSApplicationWorkspace.default().allApplications()\n            if proxies.isEmpty {/' \
            Sources/Comet/Core/Service/ApplicationWorkspace.swift

          cat > Sources/Comet/Core/Extensions/Color+Hex.swift << 'EOF'
          import SwiftUI
          import UIKit

          public extension Color {
              func toHex() -> String {
                  let uiColor = UIColor(self)
                  var r: CGFloat = 0
                  var g: CGFloat = 0
                  var b: CGFloat = 0
                  var a: CGFloat = 0
                  uiColor.getRed(&r, green: &g, blue: &b, alpha: &a)
                  let rgb: Int = (Int)(r * 255) << 16 | (Int)(g * 255) << 8 | (Int)(b * 255) << 0
                  return String(format: "#%06x", rgb)
              }

              init(hex: String) {
                  let hex = hex.trimmingCharacters(in: CharacterSet.alphanumerics.inverted)
                  var int: UInt64 = 0
                  Scanner(string: hex).scanHexInt64(&int)
                  let a, r, g, b: UInt64
                  switch hex.count {
                  case 3:
                      (a, r, g, b) = (255, (int >> 8) * 17, (int >> 4 & 0xF) * 17, (int & 0xF) * 17)
                  case 6:
                      (a, r, g, b) = (255, int >> 16, int >> 8 & 0xFF, int & 0xFF)
                  case 8:
                      (a, r, g, b) = (int >> 24, int >> 16 & 0xFF, int >> 8 & 0xFF, int & 0xFF)
                  default:
                      (a, r, g, b) = (255, 0, 0, 0)
                  }
                  self.init(
                      .sRGB,
                      red: Double(r) / 255,
                      green: Double(g) / 255,
                      blue: Double(b) / 255,
                      opacity: Double(a) / 255
                  )
              }
          }
          EOF

          export THEOS_PACKAGE_SCHEME=rootless
          make package

          # Chỉ dùng Comet.framework làm dependency lúc build Cardculator.
          # Không package Comet vào Cardculator.
          mkdir -p "$THEOS/lib/iphone/rootless"

          COMET_FW=$(find "$HOME/developer/Comet" -name "Comet.framework" -type d | head -1)

          find "$HOME/developer/Comet" -name "*.framework" -type d

          if [ -z "$COMET_FW" ]; then
              echo "ERROR: Comet.framework not found"
              exit 1
          fi

          echo "Found Comet.framework:"
          echo "$COMET_FW"

          rm -rf "$THEOS/lib/iphone/rootless/Comet.framework"
          cp -R "$COMET_FW" "$THEOS/lib/iphone/rootless/"

          # Kiểm tra binary Comet
          echo "----- Comet binary dependencies -----"
          otool -L "$THEOS/lib/iphone/rootless/Comet.framework/Comet" || true
          ls -la "$THEOS/lib/iphone/rootless/" || true
          ls -la "$THEOS/lib/" | grep -i comet || true
          
      # ---------- Thêm RemoteLog.h ----------
      - name: Add RemoteLog.h
        run: |
          curl -L -o "$THEOS/include/RemoteLog.h" \
            https://raw.githubusercontent.com/Muirey03/RemoteLog/master/RemoteLog.h

      # ---------- Build Cardculator ----------
      - name: Build Cardculator .deb
        run: |
          unset DEVELOPER_DIR
          cd $GITHUB_WORKSPACE

          # Vá CydiaSubstrate.tbd - bỏ arch simulator
          find "$THEOS" -name "CydiaSubstrate.tbd" | while read tbd; do
            echo "Fixing $tbd"
            sed -i '' 's/, i386, x86_64//' "$tbd"
            sed -i '' 's/, i386//' "$tbd"
            sed -i '' 's/, x86_64//' "$tbd"
            sed -i '' 's/platform: ios$/platform: iphoneos/' "$tbd"
            head -8 "$tbd"
          done

          sed -i '' 's|iphone:clang:16.4:13.0|iphone:clang:18.4:14.0|' Makefile
          sed -i '' 's|iPhoneOS16.4.sdk|iPhoneOS18.4.sdk|g' Makefile

          # Vá tất cả Makefile con (prefs, cardculatorccmodule, ...)
          find . -name "Makefile" | while read mk; do
            echo "Patching $mk"
            sed -i '' 's|iphone:clang:[0-9.]*:[0-9.]*|iphone:clang:18.4:14.0|g' "$mk"
            sed -i '' 's|iPhoneOS[0-9.]*\.sdk|iPhoneOS18.4.sdk|g' "$mk"
          done
          
          echo 'Cardculator_LDFLAGS += -F$(THEOS)/lib -F$(THEOS)/lib/iphone/rootless' >> Makefile
          echo 'Cardculator_FRAMEWORKS += Comet' >> Makefile
          echo 'Cardculator_SWIFTFLAGS += -F$(THEOS)/lib -F$(THEOS)/lib/iphone/rootless -framework Comet' >> Makefile

          # Bỏ SwiftUI Preview (gây lỗi linker trên device)
          if [ -f Sources/Cardculator/CalculatorView.swift ]; then
            # Xóa từ dòng #Preview hoặc struct ..._Previews trở đi
            sed -i '' '/#Preview/,/^}/d' Sources/Cardculator/CalculatorView.swift || true
            sed -i '' '/struct CalculatorView_Previews/,/^}/d' Sources/Cardculator/CalculatorView.swift || true
            sed -i '' '/PreviewProvider/,/^}/d' Sources/Cardculator/CalculatorView.swift || true
          fi

          # Vá CalculatorWindow.swift - tránh toán tử - trên UIWindow.Level
          sed -i '' 's|windowLevel = UIWindow.Level.statusBar - 1|windowLevel = UIWindow.Level(rawValue: UIWindow.Level.statusBar.rawValue - 1)|' Sources/Cardculator/CalculatorWindow.swift

          # Tìm và vá PreferenceStorage.swift
          PREF_FILE=$(find . -name "PreferenceStorage.swift" | head -1)
          echo "Found PreferenceStorage at: $PREF_FILE"
          if [ -n "$PREF_FILE" ]; then
            echo "----- trước khi vá -----"
            head -25 "$PREF_FILE"

            if ! grep -q "import UIKit" "$PREF_FILE"; then
              printf 'import UIKit\n' | cat - "$PREF_FILE" > /tmp/prefs_tmp.swift
              mv /tmp/prefs_tmp.swift "$PREF_FILE"
            fi

            sed -i '' 's|UIImpactFeedbackGenerator\.FeedbackStyle\.light\.rawValue|0|g' "$PREF_FILE"
            sed -i '' 's|UIImpactFeedbackGenerator\.FeedbackStyle\.medium\.rawValue|1|g' "$PREF_FILE"
            sed -i '' 's|UIImpactFeedbackGenerator\.FeedbackStyle\.heavy\.rawValue|2|g' "$PREF_FILE"
            # Phòng trường hợp viết khác
            sed -i '' 's|UIImpactFeedbackGenerator\.FeedbackStyle\.light\.rawValue|0|g' "$PREF_FILE"
            perl -i -pe 's/UIImpactFeedbackGenerator\.FeedbackStyle\.light\.rawValue/0/g' "$PREF_FILE"

            echo "----- sau khi vá -----"
            head -25 "$PREF_FILE"
            grep -n "hapticFeedback\|UIImpact\|import UIKit" "$PREF_FILE" || true
          else
            echo "ERROR: PreferenceStorage.swift not found anywhere"
            find . -name "*.swift" | grep -i pref
          fi

          PREF_BIN=$(find . -path "*prefs.bundle/prefs" -type f | head -1)

          echo "prefs binary: $PREF_BIN"

          if [ -n "$PREF_BIN" ]; then
              echo "----- BEFORE -----"
              otool -L "$PREF_BIN"

              install_name_tool \
                  -change "/Library/Frameworks/Comet.framework/Comet" \
                  "@rpath/Comet.framework/Comet" \
                  "$PREF_BIN"

              echo "----- AFTER -----"
              otool -L "$PREF_BIN"
          fi

          export THEOS_PACKAGE_SCHEME=rootless
          make spm

          echo "=========================================="
          echo "Checking Cardculator preference bundle"
          echo "=========================================="

          PREF_BIN=$(find . -path "*/prefs.bundle/prefs" -type f | head -1)

          if [ -z "$PREF_BIN" ]; then
              echo "ERROR: prefs binary not found"
              find . -name "prefs" -type f
              exit 1
          fi

          echo "prefs binary:"
          echo "$PREF_BIN"

          echo "----- BEFORE -----"
          otool -L "$PREF_BIN"

          # Fix absolute/rootful Comet path -> rootless rpath
          if otool -L "$PREF_BIN" | grep -q "/Library/Frameworks/Comet.framework/Comet"; then
              echo "Fixing rootful Comet dependency..."

              install_name_tool \
                  -change "/Library/Frameworks/Comet.framework/Comet" \
                  "@rpath/Comet.framework/Comet" \
                  "$PREF_BIN"
          fi

          echo "----- AFTER -----"
          otool -L "$PREF_BIN"

          echo "----- RPATH -----"
          otool -l "$PREF_BIN" | grep -A2 -B1 LC_RPATH || true

          make package THEOS_PACKAGE_SCHEME=rootless

      - name: Locate .deb output
        run: find . -name "*.deb"

      - name: Upload .deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: cardculator-deb
          path: packages/*.deb
