name: Build Cardculator .deb

on:
  workflow_dispatch:   # cho phép bấm nút "Run workflow" thủ công trên GitHub
  push:
    branches: [main]

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout Cardculator source
        uses: actions/checkout@v4

      - name: List available Xcode versions
        run: ls /Applications | grep -i xcode

      - name: Select and pin correct Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode.app
          echo "DEVELOPER_DIR=/Applications/Xcode.app/Contents/Developer" >> $GITHUB_ENV
          xcodebuild -version

      # Theos có một tham chiếu cứng tới đường dẫn Xcode-15.4.0.app ở đâu đó
      # trong quá trình build swift-support. Tạo symlink giả để thoả điều kiện đó.
      - name: Workaround hardcoded Xcode-15.4.0.app path
        run: |
          sudo ln -sf /Applications/Xcode.app /Applications/Xcode-15.4.0.app
          ls -la /Applications/Xcode-15.4.0.app
          
      # ---------- Cài Theos ----------
      - name: Install Theos
        run: |
          export THEOS=$HOME/theos
          git clone --recursive https://github.com/theos/theos.git $THEOS
          echo "THEOS=$THEOS" >> $GITHUB_ENV

      - name: Switch Theos to orion branch
        run: |
          cd $THEOS
          git fetch && git checkout orion && git submodule update --init

      # ---------- Tải iPhoneOS SDK hiện đại (khớp Swift compiler của Xcode 16.4) ----------
      - name: Download iPhoneOS18.4.sdk
        run: |
          mkdir -p "$THEOS/sdks"
          curl -L -o /tmp/iPhoneOS18.4.sdk.zip \
            "https://github.com/xybp888/iOS-SDKs/releases/download/iOS18.4-SDKs/iPhoneOS18.4.sdk.zip"
          unzip -q /tmp/iPhoneOS18.4.sdk.zip -d "$THEOS/sdks"
          echo "----- Nội dung $THEOS/sdks -----"
          ls -la "$THEOS/sdks"
          du -sh "$THEOS/sdks"/iPhoneOS18.4.sdk

      # ---------- Build Comet (thư viện SwiftUI cho preferences) ----------
      - name: Clone and build Comet
        run: |
          unset DEVELOPER_DIR
          echo "Active Xcode: $(xcode-select -p)"
          mkdir -p $HOME/developer
          cd $HOME/developer
          git clone https://github.com/ginsudev/Comet.git
          cd Comet

          sed -i '' 's|TARGET = iphone:clang:16.5:14.5|TARGET = iphone:clang:18.4:14.5|' Makefile

          cat > Sources/CometC/include/LSApplicationWorkspace.h << 'EOF'
          #import <Foundation/Foundation.h>
          NS_ASSUME_NONNULL_BEGIN
          @interface LSApplicationRecord : NSObject
          @property (readonly) NSArray<NSString *> * appTags;
          @property (getter=isLaunchProhibited,readonly) BOOL launchProhibited;
          @end
          @interface LSApplicationProxy : NSObject
          @property (nonatomic,readonly) LSApplicationRecord * correspondingApplicationRecord;
          @property (nonatomic,readonly) NSString * applicationType;
          @property (nonatomic,readonly) NSString * applicationIdentifier;
          @property (nonatomic,readonly) NSString * localizedName;
          @property (nonatomic,readonly) NSURL * bundleURL;
          + (instancetype)applicationProxyForIdentifier:(NSString *)identifier;
          @end
          @interface LSApplicationWorkspace : NSObject
          + (instancetype)defaultWorkspace;
          - (NSArray<LSApplicationProxy *> *)allApplications;
          - (NSArray<LSApplicationProxy *> *)allInstalledApplications;
          - (BOOL)openApplicationWithBundleID:(NSString *)bundleID;
          @end
          NS_ASSUME_NONNULL_END
          EOF

          cat > Sources/Comet/Core/Extensions/Bundle+Comet.swift << 'EOF'
          import Foundation
          internal extension Bundle {
              static var comet: Bundle {
                  Bundle(path: "/var/jb/Library/Frameworks/Comet.framework/Bundle.bundle/")!
              }
          }
          EOF

          # Vá ApplicationWorkspace.swift (cách chắc chắn)
          sed -i '' \
            -e 's/guard let proxies = LSApplicationWorkspace.default().allApplications() else {/let proxies = LSApplicationWorkspace.default().allApplications()\n            if proxies.isEmpty {/' \
            Sources/Comet/Core/Service/ApplicationWorkspace.swift

          export THEOS_PACKAGE_SCHEME=rootless
          make spm
          make package ROOTLESS=true

      # ---------- Thêm RemoteLog.h ----------
      - name: Add RemoteLog.h
        run: |
          curl -L -o "$THEOS/include/RemoteLog.h" \
            https://raw.githubusercontent.com/Muirey03/RemoteLog/master/RemoteLog.h

      # ---------- Build Cardculator ----------
      - name: Build Cardculator .deb
        run: |
          unset DEVELOPER_DIR
          cd $GITHUB_WORKSPACE
          make spm
          make do THEOS_PACKAGE_SCHEME=rootless || true
          # 'make do' báo lỗi thiếu THEOS_DEVICE_IP là bình thường —
          # nghĩa là build .deb đã thành công, chỉ là bước cài lên máy bị bỏ qua.

      - name: Locate .deb output
        run: find . -name "*.deb"

      - name: Upload .deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: cardculator-deb
          path: packages/*.deb
