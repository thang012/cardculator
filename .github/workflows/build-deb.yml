name: Build Cardculator 2.1.1

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout Cardculator
        uses: actions/checkout@v4

      # Cardculator/Comet 1.0.5 were built with the Xcode 15.4-era
      # Theos/Swift environment. Comet 1.0.5 itself contains a hardcoded
      # Xcode-15.4.0.app path.
      - name: Select Xcode 16.4
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "16.4"

      - name: Show Xcode
        run: |
          xcode-select -p
          xcodebuild -version
          swift --version

      # ------------------------------------------------------------
      # THEOS
      # ------------------------------------------------------------
      - name: Install Theos
        shell: bash
        run: |
          set -e

          export THEOS="$HOME/theos"

          git clone --recursive \
            --branch orion \
            https://github.com/theos/theos.git \
            "$THEOS"

          cd "$THEOS"

          git submodule update --init --recursive

          echo "THEOS=$THEOS" >> "$GITHUB_ENV"

          echo "Theos:"
          git rev-parse HEAD

      # ------------------------------------------------------------
      # iPhoneOS 16.4 SDK
      #
      # Cardculator's original Makefiles explicitly target 16.4.
      # Do not rewrite them to SDK 18.4/15.0.
      # ------------------------------------------------------------
      - name: Install iPhoneOS 16.4 SDK
        shell: bash
        run: |
          set -e

          mkdir -p "$THEOS/sdks"

          curl -L \
            --fail \
            --retry 3 \
            -o /tmp/iPhoneOS16.4.sdk.zip \
            "https://github.com/xybp888/iOS-SDKs/releases/download/iOS16.4-SDKs/iPhoneOS16.4.sdk.zip"

          unzip -q \
            /tmp/iPhoneOS16.4.sdk.zip \
            -d "$THEOS/sdks"

          test -d "$THEOS/sdks/iPhoneOS16.4.sdk"

          echo "Installed SDK:"
          ls -ld "$THEOS/sdks/iPhoneOS16.4.sdk"

      # ------------------------------------------------------------
      # COMET 1.0.5
      #
      # Exact upstream commit:
      # 8f70074 = "rootless fix"
      #
      # This commit's Makefile already supports:
      # ROOTLESS=1
      # /var/jb/Library/Frameworks
      # PACKAGE_VERSION=1.0.5
      # ------------------------------------------------------------
      - name: Build Comet 1.0.5 rootless
        shell: bash
        run: |
          set -e

          brew install ldid

          mkdir -p "$HOME/developer"

          git clone \
            https://github.com/ginsudev/Comet.git \
            "$HOME/developer/Comet"

          cd "$HOME/developer/Comet"

          git checkout 8f70074

          echo "Comet commit:"
          git rev-parse HEAD

          echo "Comet Makefile:"
          sed -n '1,60p' Makefile

          # Verify that this really is the 1.0.5 source.
          grep -q 'PACKAGE_VERSION = 1.0.5' Makefile

          test -d /Applications/Xcode-15.4.0.app

          # Build the actual rootless Comet framework/package.
          #
          # IMPORTANT:
          # ROOTLESS=1 is required by Comet 1.0.5.
          # Merely setting THEOS_PACKAGE_SCHEME=rootless is NOT enough.
          export ROOTLESS=1
          export THEOS_PACKAGE_SCHEME=rootless

          make clean || true

          make package \
            ROOTLESS=1 \
            FINALPACKAGE=1

          echo "Comet packages:"
          find packages -type f -name '*.deb' -print

          # Comet 1.0.5's rootless build copies its framework into
          # THEOS/lib/iphone/rootless automatically.
          echo "Theos Comet framework:"
          find "$THEOS/lib/iphone/rootless" \
            -maxdepth 2 \
            -name 'Comet.framework' \
            -print

          COMET_FW="$THEOS/lib/iphone/rootless/Comet.framework"

          test -d "$COMET_FW"
          test -f "$COMET_FW/Comet"

          echo "----- Comet binary -----"
          file "$COMET_FW/Comet"

          echo "----- Comet dependencies -----"
          otool -L "$COMET_FW/Comet"

          echo "----- Comet install name -----"
          otool -D "$COMET_FW/Comet" || true

      # ------------------------------------------------------------
      # RemoteLog.h
      # ------------------------------------------------------------
      - name: Install RemoteLog.h
        shell: bash
        run: |
          set -e

          curl -L \
            --fail \
            --retry 3 \
            -o "$THEOS/include/RemoteLog.h" \
            https://raw.githubusercontent.com/Muirey03/RemoteLog/master/RemoteLog.h

          test -f "$THEOS/include/RemoteLog.h"

      # ------------------------------------------------------------
      # VERIFY ORIGINAL MAKEFILES
      #
      # We intentionally do NOT globally rewrite deployment targets.
      # ------------------------------------------------------------
      - name: Verify Cardculator Makefiles
        shell: bash
        run: |
          set -e

          echo "===== Root Makefile ====="
          cat Makefile

          echo "===== prefs/Makefile ====="
          cat prefs/Makefile

          echo "===== cardculatorccmodule/Makefile ====="
          cat cardculatorccmodule/Makefile

          echo "===== control ====="
          cat control

          grep -q 'Version: 2.1.1' control
          grep -q 'com.ginsu.comet' control

      # ------------------------------------------------------------
      # BUILD CARDculator
      # ------------------------------------------------------------
      - name: Build Cardculator
        shell: bash
        run: |
          set -e

          cd "$GITHUB_WORKSPACE"

          export THEOS_PACKAGE_SCHEME=rootless

          # Clean anything generated by previous attempts.
          make clean || true

          # Generate the Theos Swift Package Manager configuration.
          make spm

          echo "===== .theos/spm_config ====="
          cat .theos/spm_config

          # Build all three components:
          #   Cardculator
          #   prefs
          #   CardculatorCCModule
          make \
            THEOS_PACKAGE_SCHEME=rootless \
            FINALPACKAGE=1

      # ------------------------------------------------------------
      # INSPECT prefs.bundle BEFORE PACKAGING
      # ------------------------------------------------------------
      - name: Verify prefs.bundle
        shell: bash
        run: |
          set -e

          PREF_BIN=$(find . \
            -path '*prefs.bundle/prefs' \
            -type f \
            -print -quit)

          if [ -z "$PREF_BIN" ]; then
            echo "ERROR: prefs binary was not produced."
            find . -name '*.bundle' -print
            exit 1
          fi

          echo "prefs binary:"
          echo "$PREF_BIN"

          echo "===== prefs file ====="
          file "$PREF_BIN"

          echo "===== prefs dependencies ====="
          otool -L "$PREF_BIN"

          echo "===== prefs load commands ====="
          otool -l "$PREF_BIN" | \
            grep -A8 -B2 \
            -E 'LC_LOAD_DYLIB|LC_RPATH|Comet.framework' \
            || true

          echo "===== Verify Comet dependency ====="

          if otool -L "$PREF_BIN" | \
             grep -q '/var/jb/Library/Frameworks/Comet.framework/Comet'
          then
            echo "OK: prefs uses rootless Comet path."
          else
            echo "WARNING: prefs does not contain the expected rootless Comet path."
            otool -L "$PREF_BIN"
          fi

      # ------------------------------------------------------------
      # PACKAGE
      # ------------------------------------------------------------
      - name: Package Cardculator rootless
        shell: bash
        run: |
          set -e

          export THEOS_PACKAGE_SCHEME=rootless

          make package \
            THEOS_PACKAGE_SCHEME=rootless \
            FINALPACKAGE=1

          echo "===== Generated packages ====="
          find packages \
            -maxdepth 1 \
            -type f \
            -name '*.deb' \
            -print

          CARD_DEB=$(find packages \
            -maxdepth 1 \
            -type f \
            -name '*.deb' \
            -print \
            | grep -v 'com.ginsu.comet' \
            | head -1)

          if [ -z "$CARD_DEB" ]; then
            echo "ERROR: Cardculator .deb not found."
            exit 1
          fi

          echo "Cardculator package:"
          echo "$CARD_DEB"

      # ------------------------------------------------------------
      # FINAL PACKAGE INSPECTION
      # ------------------------------------------------------------
      - name: Inspect final .deb
        shell: bash
        run: |
          set -e

          CARD_DEB=$(find packages \
            -maxdepth 1 \
            -type f \
            -name '*.deb' \
            -print \
            | grep -v 'com.ginsu.comet' \
            | head -1)

          echo "===== DEB CONTROL ====="
          dpkg-deb -I "$CARD_DEB"

          echo "===== DEB CONTENTS ====="
          dpkg-deb -c "$CARD_DEB"

          echo "===== Verify required bundles ====="

          dpkg-deb -c "$CARD_DEB" | grep -q \
            'Library/PreferenceBundles/prefs.bundle'

          dpkg-deb -c "$CARD_DEB" | grep -q \
            'Library/ControlCenter/Bundles/CardculatorCCModule.bundle'

          dpkg-deb -c "$CARD_DEB" | grep -q \
            'Library/MobileSubstrate/DynamicLibraries/Cardculator.dylib' \
            || \
          dpkg-deb -c "$CARD_DEB" | grep -q \
            'Library/MobileSubstrate/DynamicLibraries/Cardculator.bundle'

          echo "Required Cardculator components found."

      # ------------------------------------------------------------
      # UPLOAD
      # ------------------------------------------------------------
      - name: Upload Cardculator .deb
        uses: actions/upload-artifact@v4
        with:
          name: Cardculator-2.1.1-rootless
          path: packages/*.deb
          if-no-files-found: error

      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Cardculator-build-diagnostics
          path: |
            packages/*.deb
            .theos/**
          if-no-files-found: ignore
