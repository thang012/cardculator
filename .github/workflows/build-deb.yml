```yaml
name: Build Comet Rootless

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15-arm64

    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
      THEOS: ${{ github.workspace }}/theos
      SDKVERSION: 18.4

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode 16.4
        shell: bash
        run: |
          set -e

          sudo xcode-select -s /Applications/Xcode_16.4.app

          echo "DEVELOPER_DIR=/Applications/Xcode_16.4.app/Contents/Developer" >> "$GITHUB_ENV"

          export DEVELOPER_DIR=/Applications/Xcode_16.4.app/Contents/Developer

          echo "========== XCODE =========="
          xcode-select -p
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-path

      - name: Install Theos
        shell: bash
        run: |
          set -e

          export DEVELOPER_DIR=/Applications/Xcode_16.4.app/Contents/Developer
          export THEOS="$GITHUB_WORKSPACE/theos"

          git clone --recursive https://github.com/theos/theos.git "$THEOS"

          echo "THEOS=$THEOS" >> "$GITHUB_ENV"

      - name: Switch Theos to Orion
        shell: bash
        run: |
          set -e

          export DEVELOPER_DIR=/Applications/Xcode_16.4.app/Contents/Developer
          export THEOS="$GITHUB_WORKSPACE/theos"

          cd "$THEOS"

          git fetch origin
          git checkout orion
          git submodule update --init --recursive

          echo "Theos branch:"
          git branch --show-current

      - name: Install iPhoneOS 18.4 SDK
        shell: bash
        run: |
          set -e

          export DEVELOPER_DIR=/Applications/Xcode_16.4.app/Contents/Developer
          export THEOS="$GITHUB_WORKSPACE/theos"

          SDK_DIR="$THEOS/sdks/iPhoneOS18.4.sdk"

          mkdir -p "$THEOS/sdks"

          curl -L \
            -o /tmp/iPhoneOS18.4.sdk.zip \
            "https://github.com/xybp888/iOS-SDKs/releases/download/iOS18.4-SDKs/iPhoneOS18.4.sdk.zip"

          unzip -q /tmp/iPhoneOS18.4.sdk.zip -d "$THEOS/sdks"

          rm -rf "$THEOS/sdks/__MACOSX"

          echo "========== INSTALLED SDKs =========="
          find "$THEOS/sdks" -maxdepth 1 -type d -name "*.sdk" -print

          echo "========== SDK SIZE =========="
          du -sh "$SDK_DIR"

          test -d "$SDK_DIR"
          test -f "$SDK_DIR/SDKSettings.plist"

          echo "iPhoneOS 18.4 SDK OK"

      - name: Configure Theos SDK
        shell: bash
        run: |
          set -e

          export DEVELOPER_DIR=/Applications/Xcode_16.4.app/Contents/Developer
          export THEOS="$GITHUB_WORKSPACE/theos"

          SDK_DIR="$THEOS/sdks/iPhoneOS18.4.sdk"

          echo "THEOS=$THEOS"
          echo "THEOS_SDKS=$THEOS/sdks"
          echo "SDKVERSION=18.4"
          echo "SYSROOT=$SDK_DIR"
          echo "SDKROOT=$SDK_DIR"

          echo "THEOS_SDKS=$THEOS/sdks" >> "$GITHUB_ENV"
          echo "SDKVERSION=18.4" >> "$GITHUB_ENV"
          echo "SYSROOT=$SDK_DIR" >> "$GITHUB_ENV"
          echo "SDKROOT=$SDK_DIR" >> "$GITHUB_ENV"

          test -d "$SDK_DIR"
          test -f "$SDK_DIR/SDKSettings.plist"

      - name: Verify Toolchain
        shell: bash
        run: |
          set -e

          export DEVELOPER_DIR=/Applications/Xcode_16.4.app/Contents/Developer
          export THEOS="$GITHUB_WORKSPACE/theos"
          export SDKVERSION=18.4
          export SYSROOT="$THEOS/sdks/iPhoneOS18.4.sdk"
          export SDKROOT="$SYSROOT"
          export THEOS_SDKS="$THEOS/sdks"

          echo "========== XCODE =========="
          xcodebuild -version
          xcode-select -p

          echo
          echo "========== XCODE IPHONEOS SDK =========="
          xcrun --sdk iphoneos --show-sdk-path

          echo
          echo "========== THEOS =========="
          echo "THEOS=$THEOS"
          echo "THEOS_SDKS=$THEOS_SDKS"
          echo "SDKVERSION=$SDKVERSION"
          echo "SYSROOT=$SYSROOT"
          echo "SDKROOT=$SDKROOT"

          echo
          echo "========== THEOS SDKs =========="
          find "$THEOS/sdks" -maxdepth 1 -type d -name "*.sdk" -print

          echo
          echo "========== SDK CHECK =========="
          test -d "$SYSROOT"
          test -f "$SYSROOT/SDKSettings.plist"

          echo "SDK verification successful."

      - name: Build Comet
        shell: bash
        run: |
          set -e

          export DEVELOPER_DIR=/Applications/Xcode_16.4.app/Contents/Developer
          export THEOS="$GITHUB_WORKSPACE/theos"
          export SDKVERSION=18.4
          export SYSROOT="$THEOS/sdks/iPhoneOS18.4.sdk"
          export SDKROOT="$SYSROOT"
          export THEOS_SDKS="$THEOS/sdks"

          # Xóa các biến Xcode/Swift cũ nếu có
          unset TOOLCHAINS
          unset SDKROOT_OVERRIDE
          unset SWIFT_EXEC
          unset DEVELOPER_DIR_OVERRIDE

          # Đảm bảo Swift/SwiftPM dùng đúng Xcode 16.4
          export PATH="/Applications/Xcode_16.4.app/Contents/Developer/usr/bin:$PATH"

          echo "========== BUILD ENVIRONMENT =========="
          echo "DEVELOPER_DIR=$DEVELOPER_DIR"
          echo "THEOS=$THEOS"
          echo "SDKVERSION=$SDKVERSION"
          echo "SYSROOT=$SYSROOT"

          echo
          echo "========== SWIFT =========="
          xcrun --find swift
          xcrun swift --version

          echo
          echo "========== CLANG =========="
          xcrun --find clang
          xcrun clang --version

          mkdir -p "$GITHUB_WORKSPACE/build"

          cd "$GITHUB_WORKSPACE/build"

          git clone https://github.com/ginsudev/Comet.git

          cd Comet

          echo
          echo "========== COMET SPM =========="

          # Đảm bảo make/Swift không lấy Xcode 15.4 từ môi trường
          export DEVELOPER_DIR=/Applications/Xcode_16.4.app/Contents/Developer

          make spm

          echo
          echo "========== COMET PACKAGE =========="

          make package ROOTLESS=true

      - name: Find DEB
        if: always()
        shell: bash
        run: |
          echo "========== .DEB FILES =========="

          find "$GITHUB_WORKSPACE" \
            -type f \
            -name "*.deb" \
            -print

      - name: Upload DEB
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Comet-rootless
          path: |
            ${{ github.workspace }}/**/*.deb
          if-no-files-found: error
```
