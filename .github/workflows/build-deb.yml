name: Build Cardculator .deb

on:
  workflow_dispatch:   # cho phép bấm nút "Run workflow" thủ công trên GitHub
  push:
    branches: [main]

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout Cardculator source
        uses: actions/checkout@v4

      - name: List available Xcode versions
        run: ls /Applications | grep -i xcode

      - name: Select and pin correct Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode.app
          echo "DEVELOPER_DIR=/Applications/Xcode.app/Contents/Developer" >> $GITHUB_ENV
          xcodebuild -version

      # Theos có một tham chiếu cứng tới đường dẫn Xcode-15.4.0.app ở đâu đó
      # trong quá trình build swift-support (vì tác giả gốc build bằng Xcode 15.4,
      # đi kèm SDK 16.4). macos-15 runner không có Xcode 15.4 nữa nên phải giả lập.
      - name: Workaround hardcoded Xcode-15.4.0.app path
        run: |
          sudo ln -sf /Applications/Xcode.app /Applications/Xcode-15.4.0.app
          ls -la /Applications/Xcode-15.4.0.app

      # ---------- Cài Theos ----------
      - name: Install Theos
        run: |
          export THEOS=$HOME/theos
          git clone --recursive https://github.com/theos/theos.git $THEOS
          echo "THEOS=$THEOS" >> $GITHUB_ENV

      - name: Switch Theos to orion branch
        run: |
          cd $THEOS
          git fetch && git checkout orion && git submodule update --init

      # ---------- Tải iPhoneOS SDK KHỚP với môi trường gốc của tác giả ----------
      # Tác giả gốc build ở SDK 16.4 (Xcode 15.4). GitHub Actions macos-15 không
      # còn Xcode cũ đó, nhưng ta không cần thiết phải nhảy hẳn lên SDK 18.4 (như
      # bản trước) — điều đó khiến compiler cho phép gọi API SwiftUI/iOS 17+/18+
      # mà máy m (16.7.1) không có, dễ gây crash runtime kiểu "app/prefs văng ngay
      # khi mở". Ta dùng iPhoneOS16.5.sdk chính thức từ theos/sdks — bản patched-sdk
      # do chính team Theos build & maintain, gần sát nhất với 16.4 gốc mà vẫn build
      # được bằng Xcode 16 hiện có trên runner.
      - name: Download iPhoneOS16.5.sdk (theos/sdks official)
        run: |
          mkdir -p "$THEOS/sdks"
          curl -L -o /tmp/iPhoneOS16.5.sdk.tar.xz \
            "https://github.com/theos/sdks/releases/download/master-146e41f/iPhoneOS16.5.sdk.tar.xz"
          tar -xJf /tmp/iPhoneOS16.5.sdk.tar.xz -C "$THEOS/sdks"
          echo "----- Nội dung $THEOS/sdks -----"
          ls -la "$THEOS/sdks"
          du -sh "$THEOS/sdks"/iPhoneOS16.5.sdk

      # ---------- Build Comet (thư viện SwiftUI cho preferences) ----------
      - name: Clone and build Comet
        run: |
          unset DEVELOPER_DIR
          echo "Active Xcode: $(xcode-select -p)"

          # Cài ldid để ký framework
          brew install ldid

          mkdir -p $HOME/developer
          cd $HOME/developer
          git clone https://github.com/ginsudev/Comet.git
          cd Comet

          # KHÔNG bump target lên 18.4 nữa. Makefile gốc của Comet đã là
          # "iphone:clang:16.5:14.5" — đúng khớp với SDK 16.5 vừa tải, để nguyên.
          echo "----- Comet Makefile TARGET (giữ nguyên, không patch) -----"
          grep -n "^TARGET" Makefile

          cat > Sources/CometC/include/LSApplicationWorkspace.h << 'EOF'
          #import <Foundation/Foundation.h>
          NS_ASSUME_NONNULL_BEGIN
          @interface LSApplicationRecord : NSObject
          @property (readonly) NSArray<NSString *> * appTags;
          @property (getter=isLaunchProhibited,readonly) BOOL launchProhibited;
          @end
          @interface LSApplicationProxy : NSObject
          @property (nonatomic,readonly) LSApplicationRecord * correspondingApplicationRecord;
          @property (nonatomic,readonly) NSString * applicationType;
          @property (nonatomic,readonly) NSString * applicationIdentifier;
          @property (nonatomic,readonly) NSString * localizedName;
          @property (nonatomic,readonly) NSURL * bundleURL;
          + (instancetype)applicationProxyForIdentifier:(NSString *)identifier;
          @end
          @interface LSApplicationWorkspace : NSObject
          + (instancetype)defaultWorkspace;
          - (NSArray<LSApplicationProxy *> *)allApplications;
          - (NSArray<LSApplicationProxy *> *)allInstalledApplications;
          - (BOOL)openApplicationWithBundleID:(NSString *)bundleID;
          @end
          NS_ASSUME_NONNULL_END
          EOF

          cat > Sources/Comet/Core/Extensions/Bundle+Comet.swift << 'EOF'
          import Foundation
          internal extension Bundle {
              static var comet: Bundle {
                  Bundle(path: "/var/jb/Library/Frameworks/Comet.framework/Bundle.bundle/")!
              }
          }
          EOF

          sed -i '' \
            -e 's/guard let proxies = LSApplicationWorkspace.default().allApplications() else {/let proxies = LSApplicationWorkspace.default().allApplications()\n            if proxies.isEmpty {/' \
            Sources/Comet/Core/Service/ApplicationWorkspace.swift

          cat > Sources/Comet/Core/Extensions/Color+Hex.swift << 'EOF'
          import SwiftUI
          import UIKit

          public extension Color {
              func toHex() -> String {
                  let uiColor = UIColor(self)
                  var r: CGFloat = 0
                  var g: CGFloat = 0
                  var b: CGFloat = 0
                  var a: CGFloat = 0
                  uiColor.getRed(&r, green: &g, blue: &b, alpha: &a)
                  let rgb: Int = (Int)(r * 255) << 16 | (Int)(g * 255) << 8 | (Int)(b * 255) << 0
                  return String(format: "#%06x", rgb)
              }

              init(hex: String) {
                  let hex = hex.trimmingCharacters(in: CharacterSet.alphanumerics.inverted)
                  var int: UInt64 = 0
                  Scanner(string: hex).scanHexInt64(&int)
                  let a, r, g, b: UInt64
                  switch hex.count {
                  case 3:
                      (a, r, g, b) = (255, (int >> 8) * 17, (int >> 4 & 0xF) * 17, (int & 0xF) * 17)
                  case 6:
                      (a, r, g, b) = (255, int >> 16, int >> 8 & 0xFF, int & 0xFF)
                  case 8:
                      (a, r, g, b) = (int >> 24, int >> 16 & 0xFF, int >> 8 & 0xFF, int & 0xFF)
                  default:
                      (a, r, g, b) = (255, 0, 0, 0)
                  }
                  self.init(
                      .sRGB,
                      red: Double(r) / 255,
                      green: Double(g) / 255,
                      blue: Double(b) / 255,
                      opacity: Double(a) / 255
                  )
              }
          }
          EOF

          export THEOS_PACKAGE_SCHEME=rootless
          make package

          # Chỉ dùng Comet.framework làm dependency lúc build Cardculator.
          # Không package Comet vào Cardculator.
          mkdir -p "$THEOS/lib/iphone/rootless"

          COMET_FW=$(find "$HOME/developer/Comet" -name "Comet.framework" -type d | head -1)

          find "$HOME/developer/Comet" -name "*.framework" -type d

          if [ -z "$COMET_FW" ]; then
              echo "ERROR: Comet.framework not found"
              exit 1
          fi

          echo "Found Comet.framework:"
          echo "$COMET_FW"

          rm -rf "$THEOS/lib/iphone/rootless/Comet.framework"
          cp -R "$COMET_FW" "$THEOS/lib/iphone/rootless/"

          # Kiểm tra binary Comet
          echo "----- Comet binary dependencies -----"
          otool -L "$THEOS/lib/iphone/rootless/Comet.framework/Comet" || true
          ls -la "$THEOS/lib/iphone/rootless/" || true
          ls -la "$THEOS/lib/" | grep -i comet || true

      # ---------- Thêm RemoteLog.h ----------
      - name: Add RemoteLog.h
        run: |
          curl -L -o "$THEOS/include/RemoteLog.h" \
            https://raw.githubusercontent.com/Muirey03/RemoteLog/master/RemoteLog.h

      # ---------- Build Cardculator ----------
      - name: Build Cardculator .deb
        run: |
          unset DEVELOPER_DIR
          cd $GITHUB_WORKSPACE

          # rpath thật của Comet.framework trên máy rootless (Sileo cài Comet vào đây).
          # Thiếu rpath này là nguyên nhân phổ biến khiến prefs pane / tweak bị dyld
          # crash ngay khi load, vì lúc link ta chỉ đổi tên thành @rpath/Comet.framework/Comet
          # nhưng binary không có LC_RPATH nào trỏ tới nơi thực sự chứa framework đó
          # trên thiết bị.
          COMET_RPATH="/var/jb/Library/Frameworks"

          # SDK khớp với môi trường gốc: dùng 16.5 (đã tải ở bước trên) thay vì 18.4.
          TARGET_SDK="iPhoneOS16.5.sdk"
          TARGET_CLANG_VER="16.5"

          # Vá CydiaSubstrate.tbd - bỏ arch simulator
          find "$THEOS" -name "CydiaSubstrate.tbd" | while read tbd; do
            echo "Fixing $tbd"
            sed -i '' 's/, i386, x86_64//' "$tbd"
            sed -i '' 's/, i386//' "$tbd"
            sed -i '' 's/, x86_64//' "$tbd"
            sed -i '' 's/platform: ios$/platform: iphoneos/' "$tbd"
            head -8 "$tbd"
          done

          # Giữ deploy-target gốc (13.0) của Cardculator, chỉ đổi SDK/clang version
          # từ 16.4 -> 16.5 (SDK 16.4 không có sẵn ở theos/sdks, 16.5 là bản vá gần
          # nhất, tương thích ABI hoàn toàn với máy 16.7.1 của m).
          sed -i '' "s|iphone:clang:16.4:13.0|iphone:clang:${TARGET_CLANG_VER}:13.0|" Makefile
          sed -i '' "s|iPhoneOS16.4.sdk|${TARGET_SDK}|g" Makefile

          # Vá tất cả Makefile con (prefs, cardculatorccmodule, ...) - giữ nguyên
          # deploy-target đang có trong từng file, chỉ chuẩn hoá SDK/clang version.
          find . -name "Makefile" | while read mk; do
            echo "Patching $mk"
            sed -i '' "s|iphone:clang:[0-9.]*:|iphone:clang:${TARGET_CLANG_VER}:|g" "$mk"
            sed -i '' "s|iPhoneOS[0-9.]*\.sdk|${TARGET_SDK}|g" "$mk"
          done

          echo "----- Makefile sau khi patch SDK -----"
          grep -rn "TARGET" --include=Makefile . || true

          # Link + rpath cho binary chính Cardculator.
          echo "Cardculator_LDFLAGS += -F\$(THEOS)/lib -F\$(THEOS)/lib/iphone/rootless -Xlinker -weak_framework -Xlinker SwiftUICore -Xlinker -rpath -Xlinker $COMET_RPATH" >> Makefile
          echo 'Cardculator_FRAMEWORKS += Comet' >> Makefile
          echo "Cardculator_SWIFTFLAGS += -F\$(THEOS)/lib -F\$(THEOS)/lib/iphone/rootless -framework Comet" >> Makefile

          # prefs.bundle cũng dùng SwiftUI -> cũng bị link cứng vào SwiftUICore, cần weak-link luôn
          PREFS_MK=$(find . -path "*/prefs/Makefile" | head -1)
          if [ -n "$PREFS_MK" ]; then
            echo "Patching $PREFS_MK for weak SwiftUICore link + Comet rpath"
            PREFS_MK=$(find . -path "*/prefs/Makefile" | head -1)
            if [ -n "$PREFS_MK" ]; then
              echo "----- Nội dung $PREFS_MK -----"
              cat "$PREFS_MK"

              INSTANCE=$(grep -oE '^[A-Za-z0-9_]+_FILES' "$PREFS_MK" | head -1 | sed 's/_FILES$//')
              echo "Detected prefs instance name: $INSTANCE"

              if [ -n "$INSTANCE" ]; then
                echo "Patching $PREFS_MK for weak SwiftUICore link + rpath (instance: $INSTANCE)"
                echo "${INSTANCE}_LDFLAGS += -Xlinker -weak_framework -Xlinker SwiftUICore" >> "$PREFS_MK"
                # FIX CHÍNH cho crash "Settings văng khi mở cài đặt tweak":
                # thêm LC_RPATH trỏ đúng chỗ Sileo cài Comet trên máy rootless.
                echo "${INSTANCE}_LDFLAGS += -Xlinker -rpath -Xlinker $COMET_RPATH" >> "$PREFS_MK"
              else
                echo "WARNING: could not detect instance name in $PREFS_MK, weak-link/rpath NOT applied"
              fi
            fi
          fi

          # Bỏ SwiftUI Preview (gây lỗi linker trên device)
          if [ -f Sources/Cardculator/CalculatorView.swift ]; then
            sed -i '' '/#Preview/,/^}/d' Sources/Cardculator/CalculatorView.swift || true
            sed -i '' '/struct CalculatorView_Previews/,/^}/d' Sources/Cardculator/CalculatorView.swift || true
            sed -i '' '/PreviewProvider/,/^}/d' Sources/Cardculator/CalculatorView.swift || true
          fi

          # Vá CalculatorWindow.swift - tránh toán tử - trên UIWindow.Level
          sed -i '' 's|windowLevel = UIWindow.Level.statusBar - 1|windowLevel = UIWindow.Level(rawValue: UIWindow.Level.statusBar.rawValue - 1)|' Sources/Cardculator/CalculatorWindow.swift

          # Tìm và vá PreferenceStorage.swift
          PREF_FILE=$(find . -name "PreferenceStorage.swift" | head -1)
          echo "Found PreferenceStorage at: $PREF_FILE"
          if [ -n "$PREF_FILE" ]; then
            echo "----- trước khi vá -----"
            head -25 "$PREF_FILE"

            if ! grep -q "import UIKit" "$PREF_FILE"; then
              printf 'import UIKit\n' | cat - "$PREF_FILE" > /tmp/prefs_tmp.swift
              mv /tmp/prefs_tmp.swift "$PREF_FILE"
            fi

            sed -i '' 's|UIImpactFeedbackGenerator\.FeedbackStyle\.light\.rawValue|0|g' "$PREF_FILE"
            sed -i '' 's|UIImpactFeedbackGenerator\.FeedbackStyle\.medium\.rawValue|1|g' "$PREF_FILE"
            sed -i '' 's|UIImpactFeedbackGenerator\.FeedbackStyle\.heavy\.rawValue|2|g' "$PREF_FILE"
            sed -i '' 's|UIImpactFeedbackGenerator\.FeedbackStyle\.light\.rawValue|0|g' "$PREF_FILE"
            perl -i -pe 's/UIImpactFeedbackGenerator\.FeedbackStyle\.light\.rawValue/0/g' "$PREF_FILE"

            echo "----- sau khi vá -----"
            head -25 "$PREF_FILE"
            grep -n "hapticFeedback\|UIImpact\|import UIKit" "$PREF_FILE" || true
          else
            echo "ERROR: PreferenceStorage.swift not found anywhere"
            find . -name "*.swift" | grep -i pref
          fi

          PREF_BIN=$(find . -path "*prefs.bundle/prefs" -type f | head -1)

          echo "prefs binary: $PREF_BIN"

          if [ -n "$PREF_BIN" ]; then
              echo "----- BEFORE -----"
              otool -L "$PREF_BIN"

              install_name_tool \
                  -change "/Library/Frameworks/Comet.framework/Comet" \
                  "@rpath/Comet.framework/Comet" \
                  "$PREF_BIN"

              echo "----- AFTER -----"
              otool -L "$PREF_BIN"
          fi

          export THEOS_PACKAGE_SCHEME=rootless
          make spm
          make THEOS_PACKAGE_SCHEME=rootless

          echo "=========================================="
          echo "Checking Cardculator preference bundle"
          echo "=========================================="

          PREF_BIN=$(find . -path "*/prefs.bundle/prefs" -type f | head -1)

          if [ -z "$PREF_BIN" ]; then
              echo "ERROR: prefs binary not found"
              find . -name "prefs" -type f
              exit 1
          fi

          echo "prefs binary:"
          echo "$PREF_BIN"

          echo "----- BEFORE -----"
          otool -L "$PREF_BIN"

          if otool -L "$PREF_BIN" | grep -q "/Library/Frameworks/Comet.framework/Comet"; then
              echo "Fixing rootful Comet dependency..."
              install_name_tool \
                  -change "/Library/Frameworks/Comet.framework/Comet" \
                  "@rpath/Comet.framework/Comet" \
                  "$PREF_BIN"
          fi

          # Belt-and-suspenders: đảm bảo rpath có trong binary kể cả khi LDFLAGS
          # ở Makefile con không được Theos áp dụng đúng.
          if ! otool -l "$PREF_BIN" | grep -A2 LC_RPATH | grep -q "$COMET_RPATH"; then
              echo "rpath $COMET_RPATH chưa có trong prefs binary, tự thêm..."
              install_name_tool -add_rpath "$COMET_RPATH" "$PREF_BIN" || true
          fi

          echo "----- AFTER -----"
          otool -L "$PREF_BIN"

          echo "----- RPATH -----"
          otool -l "$PREF_BIN" | grep -A2 -B1 LC_RPATH || true

          # ---------- Quét & vá rpath cho MỌI Mach-O binary có link Comet ----------
          echo "=========================================="
          echo "Scanning all staged binaries for Comet linkage"
          echo "=========================================="

          STAGE_DIR=".theos/_"
          if [ -d "$STAGE_DIR" ]; then
            find "$STAGE_DIR" -type f | while read -r bin; do
              if file "$bin" 2>/dev/null | grep -q "Mach-O"; then
                if otool -L "$bin" 2>/dev/null | grep -q "Comet"; then
                  echo "---- $bin ----"
                  otool -L "$bin"

                  if otool -L "$bin" | grep -q "/Library/Frameworks/Comet.framework/Comet"; then
                    echo "  -> vá rootful path thành @rpath"
                    install_name_tool -change \
                      "/Library/Frameworks/Comet.framework/Comet" \
                      "@rpath/Comet.framework/Comet" \
                      "$bin" || true
                  fi

                  if ! otool -l "$bin" | grep -A2 LC_RPATH | grep -q "$COMET_RPATH"; then
                    echo "  -> thêm rpath $COMET_RPATH"
                    install_name_tool -add_rpath "$COMET_RPATH" "$bin" || true
                  fi

                  echo "  ---- sau khi vá ----"
                  otool -L "$bin"
                  otool -l "$bin" | grep -A2 -B1 LC_RPATH || true
                fi
              fi
            done
          else
            echo "WARNING: không tìm thấy staging dir $STAGE_DIR, bỏ qua bước quét toàn bộ (chỉ prefs đã được vá ở trên)"
          fi

          export THEOS_PACKAGE_SCHEME=rootless
          make package THEOS_PACKAGE_SCHEME=rootless

      - name: Locate .deb output
        run: find . -name "*.deb"

      - name: Upload .deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: cardculator-deb
          path: packages/*.deb
