name: Build Cardculator .deb

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: macos-15

    steps:
      # ---------- Checkout ----------
      - name: Checkout Cardculator source
        uses: actions/checkout@v4

      # ---------- Xcode ----------
      - name: Select Xcode 16.4
        run: |
          sudo xcode-select -s /Applications/Xcode_16.4.app

          echo "DEVELOPER_DIR=/Applications/Xcode_16.4.app/Contents/Developer" >> "$GITHUB_ENV"

          export DEVELOPER_DIR=/Applications/Xcode_16.4.app/Contents/Developer

          xcode-select -p
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-path

      # ---------- Cài Theos ----------
      - name: Install Theos
        run: |
          export THEOS="$HOME/theos"

          git clone --recursive https://github.com/theos/theos.git "$THEOS"

          echo "THEOS=$THEOS" >> "$GITHUB_ENV"

      # ---------- Theos Orion ----------
      - name: Switch Theos to orion branch
        run: |
          cd "$THEOS"

          git fetch origin
          git checkout orion

          git submodule update --init --recursive

          echo "Theos branch:"
          git branch --show-current

      # ---------- iPhoneOS 18.4 SDK ----------
      - name: Install iPhoneOS 18.4 SDK
        run: |
          SDK_DIR="$THEOS/sdks/iPhoneOS18.4.sdk"

          mkdir -p "$THEOS/sdks"

          curl -L \
            -o /tmp/iPhoneOS18.4.sdk.zip \
            "https://github.com/xybp888/iOS-SDKs/releases/download/iOS18.4-SDKs/iPhoneOS18.4.sdk.zip"

          unzip -q /tmp/iPhoneOS18.4.sdk.zip -d "$THEOS/sdks"

          # Xóa metadata thừa nếu có
          rm -rf "$THEOS/sdks/__MACOSX"

          echo "Installed SDKs:"
          find "$THEOS/sdks" -maxdepth 1 -type d -name "*.sdk" -print

          echo "SDK size:"
          du -sh "$SDK_DIR"

          # Kiểm tra SDK thực sự tồn tại
          test -d "$SDK_DIR"

          # Kiểm tra SDK có các thành phần cơ bản
          test -f "$SDK_DIR/SDKSettings.plist"

          echo "iPhoneOS 18.4 SDK OK"

      # ---------- Ép Theos dùng SDK 18.4 ----------
      - name: Configure Theos SDK
        run: |
          SDK_DIR="$THEOS/sdks/iPhoneOS18.4.sdk"

          echo "SDK_DIR=$SDK_DIR"

          # Các biến này được export cho những step sau
          echo "THEOS_SDKS=$THEOS/sdks" >> "$GITHUB_ENV"
          echo "SDKVERSION=18.4" >> "$GITHUB_ENV"
          echo "SYSROOT=$SDK_DIR" >> "$GITHUB_ENV"
          echo "SDKROOT=$SDK_DIR" >> "$GITHUB_ENV"

          # Kiểm tra
          test -d "$SDK_DIR"

          echo "THEOS_SDKS=$THEOS/sdks"
          echo "SDKVERSION=18.4"
          echo "SYSROOT=$SDK_DIR"
          echo "SDKROOT=$SDK_DIR"

      # ---------- Debug SDK / Theos ----------
      - name: Verify Theos SDK
        run: |
          echo "========== XCODE =========="
          xcodebuild -version
          xcode-select -p

          echo
          echo "========== SDK =========="
          echo "THEOS=$THEOS"
          echo "THEOS_SDKS=$THEOS_SDKS"
          echo "SDKVERSION=$SDKVERSION"
          echo "SYSROOT=$SYSROOT"
          echo "SDKROOT=$SDKROOT"

          echo
          echo "========== INSTALLED THEOS SDKS =========="
          find "$THEOS/sdks" -maxdepth 1 -type d -name "*.sdk" -print

          echo
          echo "========== XCODE IPHONEOS SDK =========="
          xcrun --sdk iphoneos --show-sdk-path

          echo
          echo "========== SDK CHECK =========="
          test -d "$THEOS/sdks/iPhoneOS18.4.sdk"
          test -f "$THEOS/sdks/iPhoneOS18.4.sdk/SDKSettings.plist"

          echo "SDK verification successful."

      # ---------- Build Comet ----------
      - name: Clone and build Comet
        run: |
          export SDKVERSION=18.4
          export SYSROOT="$THEOS/sdks/iPhoneOS18.4.sdk"
          export SDKROOT="$SYSROOT"
          export THEOS_SDKS="$THEOS/sdks"

          echo "Building Comet with:"
          echo "THEOS=$THEOS"
          echo "SDKVERSION=$SDKVERSION"
          echo "SYSROOT=$SYSROOT"

          mkdir -p "$HOME/developer"

          cd "$HOME/developer"

          git clone https://github.com/ginsudev/Comet.git

          cd Comet

          echo "========== COMET SPM =========="

          make spm

          echo "========== COMET PACKAGE =========="

          make package ROOTLESS=true

      # ---------- RemoteLog ----------
      - name: Add RemoteLog.h
        run: |
          curl -L \
            -o "$THEOS/include/RemoteLog.h" \
            "https://raw.githubusercontent.com/Muirey03/RemoteLog/master/RemoteLog.h"

          test -f "$THEOS/include/RemoteLog.h"

          echo "RemoteLog.h installed."

      # ---------- Build Cardculator ----------
      - name: Build Cardculator .deb
        run: |
          export SDKVERSION=18.4
          export SYSROOT="$THEOS/sdks/iPhoneOS18.4.sdk"
          export SDKROOT="$SYSROOT"
          export THEOS_SDKS="$THEOS/sdks"

          cd "$GITHUB_WORKSPACE"

          echo "========== CARDculator BUILD =========="
          echo "THEOS=$THEOS"
          echo "SDKVERSION=$SDKVERSION"
          echo "SYSROOT=$SYSROOT"
          echo "SDKROOT=$SDKROOT"

          echo
          echo "========== MAKE SPM =========="

          make spm

          echo
          echo "========== MAKE PACKAGE =========="

          make do THEOS_PACKAGE_SCHEME=rootless

      # ---------- Find package ----------
      - name: Locate .deb output
        if: always()
        run: |
          echo "========== .DEB FILES =========="

          find "$GITHUB_WORKSPACE" \
            -type f \
            -name "*.deb" \
            -print

      # ---------- Upload ----------
      - name: Upload .deb artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: cardculator-deb
          path: packages/*.deb
          if-no-files-found: error
