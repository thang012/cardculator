name: Build Cardculator 2.1.1

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15

    env:
      THEOS: ${{ github.workspace }}/theos
      THEOS_PACKAGE_SCHEME: rootless
      FINALPACKAGE: 1

    steps:
      # ============================================================
      # CHECKOUT
      # ============================================================

      - name: Checkout Cardculator
        uses: actions/checkout@v4

      # ============================================================
      # XCODE
      # macos-15 currently provides Xcode 16.4.
      # ============================================================

      - name: Select Xcode 16.4
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "16.4"

      - name: Verify Xcode
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "              XCODE"
          echo "=========================================="

          xcode-select -p
          xcodebuild -version

          echo
          echo "Available SDKs:"
          xcodebuild -showsdks

      # ============================================================
      # THEOS
      # ============================================================

      - name: Install Theos
        shell: bash
        run: |
          set -e

          rm -rf "$THEOS"

          git clone \
            --recursive \
            https://github.com/theos/theos.git \
            "$THEOS"

          cd "$THEOS"

          git submodule update --init --recursive

          echo "=========================================="
          echo "              THEOS"
          echo "=========================================="

          echo "THEOS = $THEOS"
          echo "Commit:"
          git rev-parse HEAD

      # ============================================================
      # LDID
      # ============================================================

      - name: Install ldid
        shell: bash
        run: |
          set -e

          brew install ldid

          echo "=========================================="
          echo "               LDID"
          echo "=========================================="

          command -v ldid
          ldid -h 2>&1 | head -20 || true

      # ============================================================
      # iPhoneOS 16.4 SDK
      #
      # Cardculator Makefile targets:
      #
      #     iphone:clang:16.4:13.0
      #
      # We therefore install the original 16.4 SDK instead of
      # modifying Cardculator's Makefile.
      # ============================================================

      - name: Install iPhoneOS 16.4 SDK
        shell: bash
        run: |
          set -e

          SDK_DIR="$THEOS/sdks"
          SDK_TMP="/tmp/iPhoneOS16.4.sdk"

          mkdir -p "$SDK_DIR"

          rm -rf "$SDK_DIR/iPhoneOS16.4.sdk"
          rm -rf "$SDK_TMP"

          echo "=========================================="
          echo "       DOWNLOAD iPhoneOS 16.4 SDK"
          echo "=========================================="

          echo
          echo "Downloaded SDK:"
          ls -ld "$SDK_TMP"

          echo
          echo "SDK size:"
          du -sh "$SDK_TMP"

          echo
          echo "Checking SDKSettings.plist..."

          test -f "$SDK_TMP/SDKSettings.plist"

          echo "SDKSettings.plist OK."

          echo
          echo "Installing SDK into Theos..."

          cp -R \
            "$SDK_TMP" \
            "$SDK_DIR/iPhoneOS16.4.sdk"

          echo
          echo "=========================================="
          echo "       INSTALLED SDK"
          echo "=========================================="

          ls -ld "$SDK_DIR/iPhoneOS16.4.sdk"

          du -sh "$SDK_DIR/iPhoneOS16.4.sdk"

          echo
          echo "SDKSettings:"
          plutil \
            -p \
            "$SDK_DIR/iPhoneOS16.4.sdk/SDKSettings.plist" \
            | head -100

          echo
          echo "SDK verification..."

          test -d "$SDK_DIR/iPhoneOS16.4.sdk"
          test -f "$SDK_DIR/iPhoneOS16.4.sdk/SDKSettings.plist"

          echo
          echo "iPhoneOS 16.4 SDK installed successfully."

      # ============================================================
      # VERIFY CARDculator SOURCE
      # ============================================================

      - name: Verify Cardculator source
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "       CARDculator SOURCE"
          echo "=========================================="

          echo
          echo "Git commit:"
          git rev-parse HEAD

          echo
          echo "Git status:"
          git status --short

          echo
          echo "control:"
          cat control

          echo
          echo "Makefile:"
          cat Makefile

          echo
          echo "=========================================="
          echo "       VERIFY VERSION"
          echo "=========================================="

          if grep -q "Version: 2.1.1" control; then
            echo "Cardculator version 2.1.1 confirmed."
          else
            echo "ERROR: Cardculator is not version 2.1.1."
            exit 1
          fi

          echo
          echo "=========================================="
          echo "       VERIFY SDK TARGET"
          echo "=========================================="

          if grep -q "iphone:clang:16.4:13.0" Makefile; then
            echo "Original SDK target confirmed:"
            echo "iphone:clang:16.4:13.0"
          else
            echo "WARNING: Expected SDK target was not found."
            grep -n "SDK" Makefile || true
          fi

      # ============================================================
      # COMET
      #
      # Cardculator requires Comet.
      #
      # IMPORTANT:
      # Do not alter Cardculator's source.
      # Build/install Comet separately first.
      # ============================================================

      - name: Clone Comet
        shell: bash
        run: |
          set -e

          COMET_DIR="$RUNNER_TEMP/Comet"

          rm -rf "$COMET_DIR"

          git clone \
            https://github.com/ginsudev/Comet.git \
            "$COMET_DIR"

          cd "$COMET_DIR"

          git fetch --all --tags

          echo "=========================================="
          echo "              COMET"
          echo "=========================================="

          echo
          echo "Remote:"
          git remote -v

          echo
          echo "Current commit:"
          git rev-parse HEAD

          echo
          echo "Tags:"
          git tag --sort=-version:refname | head -20

          echo
          echo "Makefile:"
          sed -n '1,220p' Makefile

      # ============================================================
      # BUILD COMET
      #
      # Comet 1.0.5 is the version required by Cardculator.
      #
      # The exact revision is resolved from the repository instead
      # of assuming a possibly stale hard-coded commit.
      # ============================================================

      - name: Build Comet
        shell: bash
        run: |
          set -e

          COMET_DIR="$RUNNER_TEMP/Comet"

          cd "$COMET_DIR"

          echo "=========================================="
          echo "          BUILD COMET 1.0.5"
          echo "=========================================="

          echo
          echo "Available tags matching 1.0.5:"
          git tag --list \
            "*1.0.5*" \
            --sort=-version:refname

          COMET_TAG=""

          for tag in \
            "1.0.5" \
            "v1.0.5"
          do
            if git rev-parse --verify "refs/tags/$tag" >/dev/null 2>&1; then
              COMET_TAG="$tag"
              break
            fi
          done

          if [ -z "$COMET_TAG" ]; then
            echo
            echo "ERROR: Comet 1.0.5 tag was not found."

            echo
            echo "All available tags:"
            git tag --sort=-version:refname | head -50

            exit 1
          fi

          echo
          echo "Using Comet tag: $COMET_TAG"

          git checkout --detach "$COMET_TAG"

          echo
          echo "Comet commit:"
          git rev-parse HEAD

          echo
          echo "Comet commit information:"
          git log -1 --format=fuller

          echo
          echo "=========================================="
          echo "          COMET MAKEFILE"
          echo "=========================================="

          cat Makefile

          echo
          echo "=========================================="
          echo "          BUILD COMET"
          echo "=========================================="

          make clean || true

          make package \
            THEOS_PACKAGE_SCHEME=rootless \
            FINALPACKAGE=1

          echo
          echo "=========================================="
          echo "          COMET PACKAGE"
          echo "=========================================="

          find packages \
            -maxdepth 1 \
            -type f \
            -name "*.deb" \
            -print

      # ============================================================
      # FIND / INSTALL COMET FRAMEWORK
      # ============================================================

      - name: Install Comet framework
        shell: bash
        run: |
          set -e

          COMET_DIR="$RUNNER_TEMP/Comet"

          echo "=========================================="
          echo "       SEARCH COMET FRAMEWORK"
          echo "=========================================="

          echo
          echo "Search inside Comet:"
          find "$COMET_DIR" \
            -type d \
            -name "Comet.framework" \
            -print

          COMET_FRAMEWORK=$(
            find "$COMET_DIR" \
              -type d \
              -name "Comet.framework" \
              -print \
              -quit
          )

          if [ -z "$COMET_FRAMEWORK" ]; then
            echo
            echo "ERROR: Comet.framework was not produced."

            echo
            echo "Comet build tree:"
            find "$COMET_DIR" \
              -maxdepth 5 \
              -print \
              | head -300

            exit 1
          fi

          echo
          echo "Found:"
          echo "$COMET_FRAMEWORK"

          TARGET="$THEOS/lib/iphone/rootless"

          mkdir -p "$TARGET"

          rm -rf "$TARGET/Comet.framework"

          cp -R \
            "$COMET_FRAMEWORK" \
            "$TARGET/Comet.framework"

          echo
          echo "Installed:"
          ls -la "$TARGET/Comet.framework"

          if [ ! -f "$TARGET/Comet.framework/Comet" ]; then
            echo
            echo "ERROR: Comet binary is missing."
            exit 1
          fi

          echo
          echo "Comet binary:"
          file "$TARGET/Comet.framework/Comet"

          echo
          echo "Comet architectures:"
          lipo -info "$TARGET/Comet.framework/Comet"

          echo
          echo "Comet dependencies:"
          otool -L "$TARGET/Comet.framework/Comet"

      # ============================================================
      # REMOTELOG
      # ============================================================

      - name: Install RemoteLog.h
        shell: bash
        run: |
          set -e

          mkdir -p "$THEOS/include"

          curl \
            --fail \
            --retry 3 \
            -L \
            https://raw.githubusercontent.com/Muirey03/RemoteLog/master/RemoteLog.h \
            -o "$THEOS/include/RemoteLog.h"

          test -f "$THEOS/include/RemoteLog.h"

          echo "RemoteLog.h installed."

      # ============================================================
      # THEOS / SPM
      # ============================================================

      - name: Prepare Theos SPM
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "             THEOS SPM"
          echo "=========================================="

          export THEOS_PACKAGE_SCHEME=rootless

          make spm

          if [ -f ".theos/spm_config" ]; then
            echo
            echo "Generated .theos/spm_config:"
            cat .theos/spm_config
          else
            echo
            echo "WARNING: .theos/spm_config was not generated."
          fi

      # ============================================================
      # BUILD CARDculator
      # ============================================================

      - name: Build Cardculator
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "       BUILD CARDculator 2.1.1"
          echo "=========================================="

          export THEOS_PACKAGE_SCHEME=rootless
          export FINALPACKAGE=1

          make clean || true

          make \
            THEOS_PACKAGE_SCHEME=rootless \
            FINALPACKAGE=1

      # ============================================================
      # INSPECT prefs.bundle
      # ============================================================

      - name: Inspect prefs.bundle
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "          INSPECT PREFS.BUNDLE"
          echo "=========================================="

          PREF_BUNDLE=$(
            find . \
              -type d \
              -name "prefs.bundle" \
              -print \
              -quit
          )

          if [ -z "$PREF_BUNDLE" ]; then
            echo "ERROR: prefs.bundle not found."

            echo
            echo "Available bundles:"
            find . \
              -type d \
              -name "*.bundle" \
              -print

            exit 1
          fi

          echo
          echo "prefs.bundle:"
          echo "$PREF_BUNDLE"

          echo
          echo "Contents:"
          find "$PREF_BUNDLE" \
            -maxdepth 2 \
            -type f \
            -print

          PREF_BINARY="$PREF_BUNDLE/prefs"

          if [ ! -f "$PREF_BINARY" ]; then
            echo
            echo "WARNING: prefs executable is not named 'prefs'."

            echo "Executable files:"
            find "$PREF_BUNDLE" \
              -type f \
              -perm -111 \
              -print
          else
            echo
            echo "=========================================="
            echo "          PREFS BINARY"
            echo "=========================================="

            file "$PREF_BINARY"

            echo
            echo "Architecture:"
            lipo -info "$PREF_BINARY"

            echo
            echo "Dependencies:"
            otool -L "$PREF_BINARY"

            echo
            echo "Load commands:"
            otool -l "$PREF_BINARY" \
              | grep \
                -A12 \
                -B3 \
                -E \
                "LC_LOAD_DYLIB|LC_RPATH|Comet.framework" \
              || true
          fi

      # ============================================================
      # PACKAGE
      # ============================================================

      - name: Package Cardculator
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "       PACKAGE CARDculator"
          echo "=========================================="

          export THEOS_PACKAGE_SCHEME=rootless
          export FINALPACKAGE=1

          make package \
            THEOS_PACKAGE_SCHEME=rootless \
            FINALPACKAGE=1

          echo
          echo "Packages:"
          find packages \
            -maxdepth 1 \
            -type f \
            -name "*.deb" \
            -print

          CARD_DEB=$(
            find packages \
              -maxdepth 1 \
              -type f \
              -name "*.deb" \
              -print \
              | grep -v "com.ginsu.comet" \
              | head -1
          )

          if [ -z "$CARD_DEB" ]; then
            echo
            echo "ERROR: Cardculator .deb was not produced."
            exit 1
          fi

          echo
          echo "Cardculator package:"
          echo "$CARD_DEB"

      # ============================================================
      # VERIFY FINAL DEB
      # ============================================================

      - name: Verify final package
        shell: bash
        run: |
          set -e

          CARD_DEB=$(
            find packages \
              -maxdepth 1 \
              -type f \
              -name "*.deb" \
              -print \
              | grep -v "com.ginsu.comet" \
              | head -1
          )

          if [ -z "$CARD_DEB" ]; then
            echo "ERROR: Cardculator package not found."
            exit 1
          fi

          echo "=========================================="
          echo "           PACKAGE CONTROL"
          echo "=========================================="

          dpkg-deb -I "$CARD_DEB"

          echo
          echo "=========================================="
          echo "           PACKAGE CONTENTS"
          echo "=========================================="

          dpkg-deb -c "$CARD_DEB"

          echo
          echo "=========================================="
          echo "           PACKAGE VERSION"
          echo "=========================================="

          VERSION=$(dpkg-deb -f "$CARD_DEB" Version)

          echo "$VERSION"

          if [ "$VERSION" != "2.1.1" ]; then
            echo "ERROR: Expected Cardculator 2.1.1."
            exit 1
          fi

          echo
          echo "=========================================="
          echo "           PACKAGE ARCHITECTURE"
          echo "=========================================="

          dpkg-deb -f "$CARD_DEB" Architecture

          echo
          echo "=========================================="
          echo "           PACKAGE DEPENDS"
          echo "=========================================="

          dpkg-deb -f "$CARD_DEB" Depends || true

          echo
          echo "=========================================="
          echo "        VERIFY PREFS.BUNDLE"
          echo "=========================================="

          dpkg-deb -c "$CARD_DEB" \
            | grep \
              "Library/PreferenceBundles/prefs.bundle"

          echo
          echo "=========================================="
          echo "      VERIFY CONTROL CENTER"
          echo "=========================================="

          dpkg-deb -c "$CARD_DEB" \
            | grep \
              "CardculatorCCModule.bundle"

          echo
          echo "=========================================="
          echo "       PACKAGE VERIFICATION OK"
          echo "=========================================="

      # ============================================================
      # UPLOAD
      # ============================================================

      - name: Upload Cardculator package
        uses: actions/upload-artifact@v4
        with:
          name: Cardculator-2.1.1-rootless
          path: packages/*.deb
          if-no-files-found: error
          retention-days: 30

      # ============================================================
      # DIAGNOSTICS
      # ============================================================

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Cardculator-build-diagnostics
          path: |
            packages/*.deb
            .theos/spm_config
          if-no-files-found: ignore
          retention-days: 30
